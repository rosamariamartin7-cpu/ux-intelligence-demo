name: Export index download
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-index-download.yml"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare index.html
        run: cp index_mobile_review_20261026.html index.html
      - uses: actions/upload-artifact@v4
        with:
          name: index-html-download
          path: index.html
          retention-days: 1

","devices":[],"markets":[],"segments":[],"evidenceSources":[],"generalRestrictions":[],"documentLimits":[],"reviewedByUx":true,"associatedFiles":{"source":{"name":"SUMA_Desk_Research_Booking_Insight_Register_Jul26_FINAL.xlsx","available":true,"role":"source"},"insightRegister":{"name":"SUMA_Desk_Research_Booking_Insight_Register_Jul26_FINAL_CORREGIDO.xlsx","size":14119,"type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","lastModified":1789912840340,"role":"insight-register"}}},"insightRegister":{"version":"insight-register-2","status":"attached-primary-source","reviewedByUx":true,"file":{"name":"SUMA_Desk_Research_Booking_Insight_Register_Jul26_FINAL_CORREGIDO.xlsx","size":14119,"type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","lastModified":1789912840340,"role":"insight-register"},"headers":["Producto","Funnel","Minifunnel","Pantalla","Componente","Elemento","Tipo","Insight / hallazgo","Evidencia","Lectura UX","Recomendación / oportunidad","Pregunta abierta","Origen","Dispositivo","Login","Mercado","Línea UX / agrupación","Observaciones","Iniciativa","Impacto UX"],"recognizedFields":["product","funnel","minifunnel","screen","component","element","recordType","insight","evidence","uxImplication","recommendation","openQuestion","origin","channelEnvironment","market","uxLine","observations","impactUx"],"rows":[{"id":"IR-1","sourceRow":4,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Valor percibido","recordType":"Evidencia externa","insight":"Estar inscrito en un programa de fidelización no implica concentrar la compra en una sola aerolínea","evidence":"McKinsey señala que los viajeros suelen pertenecer a 3–4 programas de una misma categoría y que incluso la aerolínea preferida concentra aproximadamente el 60% del gasto. BCG sitúa en 9 la media de programas de fidelización entre europeos. Fuente: deskresearch_suma.pdf, p.3.","uxImplication":"La condición de miembro no debe interpretarse como intención de compra asegurada. El valor de SUMA necesita hacerse visible dentro del booking antes de las decisiones relevantes.","recommendation":"Mostrar ventajas concretas y útiles asociadas a la reserva actual, evitando mensajes promocionales genéricos.","openQuestion":"¿Qué beneficios concretos modifican la elección de vuelo, tarifa o extra en usuarios SUMA?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fidelización · Valor en contexto","observations":"Evidencia externa. Describe comportamiento general de fidelización; no demuestra por sí sola el efecto de SUMA en Air Europa.","impactUx":"Alto","extraFields":{"Login":"Ambos","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-2","sourceRow":5,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Jerarquía de beneficios","recordType":"Evidencia externa","insight":"Sencillez, utilidad económica, flexibilidad y facilidad de uso pesan más que beneficios aspiracionales durante la decisión","evidence":"Deloitte: el 86% considera importantes o muy importantes las recompensas económicas, la sencillez y la facilidad de uso; 4 de cada 5 valora la flexibilidad. McKinsey, en elección aérea: precio 34%, equipaje 16%, asiento 10%, flexibilidad 9% y sala VIP 4%. Fuente: deskresearch_suma.pdf, p.4.","uxImplication":"En Fare Families conviene priorizar beneficios SUMA que resuelven necesidades inmediatas del viaje frente a ventajas menos decisivas en ese momento.","recommendation":"Dar prioridad visual a equipaje, asiento, flexibilidad, prioridad y ahorro directo cuando correspondan al usuario.","openQuestion":"¿Qué beneficios SUMA tienen mayor efecto real sobre la elección de tarifa en Air Europa?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fare Families · Beneficio tangible","observations":"Evidencia externa. Los pesos de elección pertenecen al estudio citado y no deben trasladarse como porcentajes propios de Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-3","sourceRow":6,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Reducción de esfuerzo","recordType":"Evidencia externa","insight":"La experiencia y la reducción de esfuerzo pueden ser más relevantes para la fidelidad que la acumulación de puntos por sí sola","evidence":"McKinsey concluye que en aerolíneas la experiencia tiene más del doble de influencia que los beneficios puramente tangibles sobre la frecuencia de compra. El informe traduce esta idea en evitar repetir datos, recordar condiciones o descubrir beneficios tarde. Fuente: deskresearch_suma.pdf, p.5.","uxImplication":"SUMA puede aportar valor como capa de servicio que reduce fricción, no solo como sistema de Millas.","recommendation":"Usar la identificación del miembro para eliminar tareas repetitivas y prevenir errores durante el booking.","openQuestion":"¿Qué fricciones del booking pueden eliminarse hoy con los datos y derechos ya conocidos del usuario SUMA?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Servicio · Reducción de esfuerzo","observations":"Evidencia externa con aplicación inferida al booking de Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-4","sourceRow":7,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Personalización SUMA","element":"Orden de personalización","recordType":"Evidencia externa","insight":"La personalización aporta más valor cuando primero simplifica y da control, y solo después recomienda productos","evidence":"McKinsey destaca asistencia práctica y control frente a una gran cantidad de recomendaciones; IATA señala velocidad, comodidad y herramientas digitales como prioridades. Fuente: deskresearch_suma.pdf, p.6.","uxImplication":"La información del miembro debería utilizarse primero para aplicar derechos, simplificar formularios y evitar ofertas incompatibles o redundantes.","recommendation":"Ordenar la personalización en este orden: servicio y claridad → relevancia → recomendación comercial.","openQuestion":"¿Qué recomendaciones actuales podrían resultar redundantes una vez aplicados automáticamente los beneficios SUMA?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Personalización · Servicio antes que venta","observations":"Evidencia externa. No valida una arquitectura concreta de personalización para Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-5","sourceRow":8,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Tipos de valor","recordType":"Evidencia externa","insight":"Los beneficios de fidelización pueden leerse como reconocimiento, conveniencia y exploración","evidence":"La literatura académica revisada distingue reconocimiento, conveniencia y exploración; el informe recomienda dar más peso a reconocimiento y conveniencia durante la compra. Fuente: deskresearch_suma.pdf, p.7.","uxImplication":"Durante el booking conviene hacer explícito que el usuario está reconocido y qué fricción concreta se le evita; las ventajas aspiracionales pueden quedar en segundo plano.","recommendation":"Diseñar mensajes de beneficio que expliquen reconocimiento y conveniencia antes que beneficios aspiracionales.","openQuestion":"¿Qué momentos del booking necesitan comunicar reconocimiento y cuáles necesitan comunicar una ventaja operativa concreta?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Reconocimiento · Conveniencia · Exploración","observations":"Marco conceptual externo. No implica que las tres dimensiones deban tener la misma presencia en todas las pantallas.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-6","sourceRow":9,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Earn de Millas","recordType":"Evidencia externa","insight":"El usuario necesita entender antes de pagar cuánto ganará y cómo cambia la acumulación entre opciones","evidence":"Collinson identifica falta de transparencia sobre puntos y umbrales como fricción. El caso KM Malta propone mostrar earn and burn por tarifa y extra antes del pago. Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"La acumulación de Millas puede formar parte de la comparación de Fare Families si se comunica de forma comprensible y condicionada.","recommendation":"Explorar Millas estimadas por tarifa y diferencias relativas entre opciones cuando el cálculo sea fiable.","openQuestion":"¿Amadeus permite calcular de forma suficientemente estable las Millas estimadas antes de seleccionar tarifa?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Millas · Earn antes de pagar","observations":"El caso KM Malta procede de un proveedor tecnológico y no es evidencia independiente de impacto.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-7","sourceRow":10,"product":"Booking","funnel":"Booking","minifunnel":"Equipaje","screen":"Equipaje","component":"Beneficio SUMA","element":"Pieza adicional","recordType":"Hecho","insight":"Silver, Gold y Platinum disponen de una pieza adicional de equipaje en bodega según las condiciones SUMA revisadas","evidence":"El informe recoge que Silver, Gold y Platinum pueden añadir una pieza adicional de equipaje en bodega. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"En Equipaje, el sistema necesita reconocer el nivel y traducirlo en una ventaja concreta para el pasajero correspondiente.","recommendation":"Mostrar y, cuando sea técnicamente posible, aplicar automáticamente la pieza incluida indicando que procede de SUMA.","openQuestion":"¿Qué condiciones de ruta, operador, tarifa o pasajero limitan la aplicación automática de esta pieza?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Equipaje · Beneficio por nivel","observations":"Hecho recogido por el informe; la aplicabilidad final depende de condiciones específicas y debe validarse contra la fuente de verdad vigente.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-8","sourceRow":11,"product":"Booking","funnel":"Booking","minifunnel":"Asientos","screen":"Asientos","component":"Beneficio SUMA","element":"Gratuidad / descuento","recordType":"Hecho","insight":"Los beneficios de asiento cambian por nivel SUMA y por momento de la reserva","evidence":"Silver dispone de asiento estándar gratuito dentro de las 48 horas anteriores al vuelo y 20% de descuento en asientos XL; Gold y Platinum disponen de reserva gratuita de todos los tipos de asiento. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"El plano de asientos debe resolver correctamente nivel, tipo de asiento y momento temporal antes de mostrar precio o gratuidad.","recommendation":"Explicar de forma visible cuándo un asiento es gratis o tiene descuento por SUMA y evitar presentar como pago algo ya cubierto.","openQuestion":"¿Qué estados necesita el seat map para mostrar beneficio disponible, condicionado, todavía no disponible o no aplicable?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Asientos · Beneficio por nivel","observations":"Hecho condicionado. No debe generalizarse el mismo patrón UX de equipaje a asientos porque la lógica de inventario y temporalidad es distinta.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-9","sourceRow":12,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Beneficios de prioridad","element":"Fast Track / sala VIP / prioridad","recordType":"Hecho","insight":"Los beneficios de prioridad, Fast Track, recogida prioritaria, sala VIP y upgrades dependen del nivel y de condiciones adicionales","evidence":"Silver, Gold y Platinum tienen facturación Business y embarque prioritario; Gold y Platinum añaden Fast Track, recogida prioritaria y acceso a salas VIP bajo condiciones; Platinum puede acceder a upgrades sujetos a disponibilidad. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"No todos los beneficios son binarios ni están disponibles en el mismo momento del journey.","recommendation":"Comunicar disponibilidad y condiciones en el punto del journey donde el beneficio pueda utilizarse, evitando prometerlo como universal.","openQuestion":"¿Qué beneficios pueden confirmarse durante booking y cuáles solo en aeropuerto, check-in u otros contextos?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Prioridad · Beneficios condicionados","observations":"Patrón transversal: parte de estos beneficios afecta también a Check-in y aeropuerto, no solo a Booking.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-10","sourceRow":13,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Motor de beneficios SUMA","element":"Reglas de aplicabilidad","recordType":"Inferencia","insight":"La aplicabilidad de un beneficio SUMA no puede resolverse solo con el nivel del usuario","evidence":"El informe identifica como variables: nivel SUMA, pasajero, tarifa, vuelo/segmento, aerolínea operadora, ruta nacional/internacional, momento de solicitud, disponibilidad, otros descuentos/promociones y reglas SkyTeam. Fuente: deskresearch_suma.pdf, pp.9–10.","uxImplication":"La lógica de beneficios necesita ser pasajero + segmento + contexto, y no un simple badge de estado.","recommendation":"Modelar las reglas de beneficio con condiciones explícitas y estados aplicable / condicionado / no disponible / no aplicable.","openQuestion":"¿Qué variables están disponibles en tiempo real durante cada paso del booking y cuáles requieren servicios adicionales?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Reglas · Pasajero + segmento + contexto","observations":"Inferencia directamente apoyada en las condiciones recopiladas. Es especialmente relevante para extras multipasajero y por segmento.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-11","sourceRow":14,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Fuente de verdad SUMA","element":"Consistencia de reglas","recordType":"Evidencia interna","insight":"Mantener reglas y condiciones SUMA en múltiples lugares aumenta el riesgo de inconsistencias","evidence":"El informe detecta una posible discrepancia entre páginas oficiales: España indica caducidad tras 24 meses de inactividad y algunas versiones de otros mercados todavía muestran 18 meses. Fuente: deskresearch_suma.pdf, p.10.","uxImplication":"Booking no debería replicar manualmente reglas de fidelización que también viven en Mi Cuenta, Check-in, app y páginas informativas.","recommendation":"Definir una fuente central de verdad para reglas y contenidos de beneficios que pueda consumirse desde los distintos canales.","openQuestion":"¿Qué sistema debe gobernar las reglas SUMA y qué superficies consumen hoy copias manuales?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Gobernanza · Fuente única de verdad","observations":"La discrepancia puede deberse a contenido desactualizado; el hallazgo demuestra riesgo de gobernanza, no cuál es la condición correcta.","impactUx":"Alto","extraFields":{"Login":"Ambos","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-12","sourceRow":15,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Integración en el journey","recordType":"Inferencia","insight":"La principal oportunidad es convertir SUMA en una capa de servicio integrada en la compra, no añadir más mensajes promocionales","evidence":"El resumen ejecutivo plantea que el pasajero identificado debería entender nivel, beneficios aplicables, inclusiones de tarifa, aportación SUMA, descuentos, condiciones y Millas sin consultar otra página. Fuente: deskresearch_suma.pdf, p.2.","uxImplication":"La fidelización debe aparecer donde modifica una decisión o reduce esfuerzo, no como comunicación paralela.","recommendation":"Integrar la información SUMA en Fare Families, Paxes, EXTRAS y Summary utilizando el contexto de cada pantalla.","openQuestion":"¿Qué información SUMA es imprescindible en cada minifunnel y cuál sería redundante?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Integración transversal · Servicio","observations":"Inferencia del informe a partir de varias fuentes. No equivale a una solución visual validada.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-13","sourceRow":16,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Tarifa vs SUMA","recordType":"Oportunidad","insight":"En Fare Families debería distinguirse qué incluye la tarifa, qué añade SUMA y cuál es el resultado final para el pasajero","evidence":"Las conclusiones indican que es necesario diferenciar inclusión de tarifa, aportación del nivel SUMA y resultado final por pasajero. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"Sin esta separación el usuario puede atribuir un beneficio al producto equivocado o no entender el valor real de su nivel.","recommendation":"Estructurar cada tarifa con una capa específica de beneficios SUMA, evitando duplicar o mezclar inclusiones.","openQuestion":"¿Qué formato permite comparar tarifa y SUMA sin aumentar la densidad de Fare Families?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fare Families · Proveniencia del beneficio","observations":"Oportunidad de diseño. Debe contrastarse con limitaciones de Amadeus y con el UI Kit.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-14","sourceRow":17,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Millas estimadas","recordType":"Oportunidad","insight":"Mostrar Millas estimadas por tarifa puede hacer visible parte del valor futuro antes de elegir","evidence":"El informe propone ejemplos como «Conseguirás aproximadamente 1.840 Millas SUMA» y «Esta tarifa genera un 50% más de Millas que la tarifa anterior». Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"La acumulación puede actuar como información comparativa si no compite con precio e inclusiones principales.","recommendation":"Explorar una comunicación secundaria de earn estimado por tarifa, usando «aproximadamente» o «estimadas» cuando proceda.","openQuestion":"¿La estimación puede calcularse con suficiente precisión antes de completar todos los datos del viaje?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fare Families · Earn estimado","observations":"Propuesta no validada. El propio informe recomienda lenguaje de estimación cuando el cálculo final dependa de condiciones posteriores.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-15","sourceRow":18,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Pasajeros","component":"Datos del pasajero / SUMA","element":"Prerrelleno","recordType":"Oportunidad","insight":"La identificación SUMA puede reducir esfuerzo si evita volver a introducir datos ya conocidos","evidence":"El informe cita el caso KM Malta, que comunica una reducción de 40–60 segundos al prerrellenar datos de miembros. Fuente: deskresearch_suma.pdf, p.5.","uxImplication":"Paxes es un punto claro donde la fidelización puede convertirse en servicio y no solo en comunicación.","recommendation":"Recuperar de forma segura los datos disponibles del miembro, permitiendo revisión y edición antes de continuar.","openQuestion":"¿Qué datos de pasajero puede recuperar Air Europa hoy y qué restricciones de consentimiento o actualización existen?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Paxes · Prerrelleno · Reducción de esfuerzo","observations":"Caso de proveedor, no estudio independiente. Debe tratarse como referencia, no como promesa de ahorro equivalente.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-16","sourceRow":19,"product":"Booking","funnel":"Booking","minifunnel":"Equipaje","screen":"Equipaje","component":"Beneficio SUMA","element":"Aplicación automática y origen","recordType":"Oportunidad","insight":"En Equipaje conviene aplicar automáticamente el derecho SUMA cuando sea posible y explicar de dónde procede","evidence":"Las conclusiones recomiendan aplicar ventajas automáticamente para evitar que el usuario pague por un servicio ya incluido; el informe identifica equipaje como uno de los beneficios más relevantes. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"La experiencia debe evitar doble pago y, al mismo tiempo, hacer visible que la ventaja proviene del nivel SUMA y no de la tarifa.","recommendation":"Mostrar estado aplicado, pasajero afectado y procedencia del beneficio antes de ofrecer equipaje adicional de pago.","openQuestion":"¿Cómo se resuelve el beneficio cuando solo algunos pasajeros del PNR son elegibles o cambia por segmento?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Equipaje · Autoaplicación","observations":"Oportunidad específica para un extra de cantidad/multipasajero; no debe extrapolarse sin cambios a otros ancillaries.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-17","sourceRow":20,"product":"Booking","funnel":"Booking","minifunnel":"Asientos","screen":"Asientos","component":"Beneficio SUMA","element":"Aplicación automática y origen","recordType":"Oportunidad","insight":"En Asientos conviene reflejar gratuidad o descuento SUMA directamente en la selección y explicar la condición aplicada","evidence":"El informe prioriza asiento gratuito o con descuento como beneficio práctico y concluye que las ventajas deben aplicarse automáticamente cuando sea posible. Fuente: deskresearch_suma.pdf, pp.4 y 11.","uxImplication":"El usuario debería entender el precio final del asiento sin tener que recordar las condiciones de su nivel.","recommendation":"Indicar por pasajero y tipo de asiento si el beneficio está aplicado, condicionado por tiempo o no disponible.","openQuestion":"¿Cómo debe representarse la gratuidad futura de Silver dentro de las 48 h sin inducir a error antes de ese momento?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Asientos · Autoaplicación","observations":"Oportunidad específica para un extra de inventario limitado y pasajero + segmento; requiere patrón propio.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-18","sourceRow":21,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Summary / Shopping cart","component":"Resumen de Millas","element":"Earn, burn y progreso","recordType":"Oportunidad","insight":"El Summary puede reunir cuánto gana el usuario, cuánto puede utilizar y su progreso hacia el siguiente nivel","evidence":"El informe propone mostrar Millas que se obtendrán, Millas utilizables y progreso como «Después de este viaje te faltarán 2 vuelos para alcanzar Silver». Fuente: deskresearch_suma.pdf, pp.8 y 11.","uxImplication":"El resumen es un punto natural para cerrar el valor de SUMA antes de pagar, siempre que la información no opaque precio y total.","recommendation":"Separar claramente ahorro actual, Millas utilizadas, Millas estimadas a obtener y progreso de nivel.","openQuestion":"¿Qué parte de esta información es calculable con certeza antes del pago y qué parte debe mostrarse como estimada?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Summary · Valor acumulado de SUMA","observations":"Oportunidad no validada. Debe coordinarse con el análisis específico ya existente del Slider de Millas.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-19","sourceRow":22,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Umbral y estimación","recordType":"Hecho","insight":"El pago mixto de vuelos operados por Air Europa requiere actualmente un mínimo de 1.500 Millas","evidence":"El informe recoge que Air Europa establece un mínimo de 1.500 Millas para el pago mixto de vuelos operados por la compañía. Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"El Slider debe comunicar el umbral y diferenciar con claridad disponibilidad real de Millas y valor aplicable a la compra.","recommendation":"Mantener el umbral visible en el contexto de uso y usar lenguaje de estimación cuando el cálculo dependa de condiciones posteriores.","openQuestion":"¿Existen rutas, operadores o mercados donde el mínimo o la lógica de pago mixto cambie?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Summary · Slider de Millas · Reglas","observations":"Hecho citado por el informe. Debe validarse contra la fuente de verdad vigente antes de convertirlo en regla permanente de UI.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-20","sourceRow":23,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Login contextual","component":"Login / SUMA","element":"Beneficio previo al login","recordType":"Oportunidad","insight":"Para usuarios no identificados, comunicar un beneficio concreto y contextual puede incentivar el login o registro sin convertirlo en el objetivo principal","evidence":"Las conclusiones indican que para usuarios no identificados comunicar beneficios concretos y contextuales puede incentivar el registro, aunque no sea el objetivo principal del proyecto. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"El login puede ganar valor cuando aparece ligado a una ventaja inmediata del paso actual.","recommendation":"Usar mensajes contextuales del tipo «Inicia sesión para aplicar tus beneficios SUMA» solo cuando exista una ventaja relevante en ese punto.","openQuestion":"¿Qué momentos generan suficiente valor para pedir identificación sin interrumpir la tarea principal?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Login contextual · Activación de beneficios","observations":"Oportunidad; no demuestra impacto en registro ni conversión. Debe evitarse convertir el booking en una campaña de captación.","impactUx":"Medio","extraFields":{"Login":"No logado","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-21","sourceRow":24,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Motor de beneficios SUMA","element":"Viabilidad técnica","recordType":"Inferencia","insight":"Antes de diseñar la solución es necesario confirmar qué información y reglas pueden resolverse realmente durante el booking","evidence":"El informe cierra señalando la necesidad de confirmar qué información proporciona Amadeus, qué reglas pueden calcularse durante la compra y qué limitaciones técnicas existen. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"La calidad de la experiencia dependerá de disponer de reglas fiables en tiempo real; sin ello, una interfaz muy explícita puede prometer beneficios incorrectos.","recommendation":"Mapear datos disponibles, responsables de cada regla, momento de cálculo y fallback antes de definir componentes finales.","openQuestion":"¿Qué datos SUMA, tarifa, pasajero, segmento y operador expone Amadeus en cada paso, y qué necesita servicios adicionales?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Viabilidad · Amadeus / PSS · Fuente de verdad","observations":"Pregunta abierta y condicionante técnico. No debe interpretarse como limitación confirmada hasta contrastarlo con equipos técnicos.","impactUx":"Alto","extraFields":{"Login":"Ambos","Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"}],"history":[{"replacedAt":"2026-09-20T14:01:31.281Z","file":{"name":"SUMA_Desk_Research_Booking_Insight_Register_Jul26_FINAL.xlsx","size":14274,"type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","lastModified":1789912167909,"role":"insight-register"},"rowCount":21,"rows":[{"id":"IR-1","sourceRow":4,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Valor percibido","recordType":"Evidencia externa","insight":"Estar inscrito en un programa de fidelización no implica concentrar la compra en una sola aerolínea","evidence":"McKinsey señala que los viajeros suelen pertenecer a 3–4 programas de una misma categoría y que incluso la aerolínea preferida concentra aproximadamente el 60% del gasto. BCG sitúa en 9 la media de programas de fidelización entre europeos. Fuente: deskresearch_suma.pdf, p.3.","uxImplication":"La condición de miembro no debe interpretarse como intención de compra asegurada. El valor de SUMA necesita hacerse visible dentro del booking antes de las decisiones relevantes.","recommendation":"Mostrar ventajas concretas y útiles asociadas a la reserva actual, evitando mensajes promocionales genéricos.","openQuestion":"¿Qué beneficios concretos modifican la elección de vuelo, tarifa o extra en usuarios SUMA?","origin":"McKinsey + BCG","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Fidelización · Valor en contexto","observations":"Evidencia externa. Describe comportamiento general de fidelización; no demuestra por sí sola el efecto de SUMA en Air Europa.","impactUx":"Alto","extraFields":{"Login":"Ambos","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-2","sourceRow":5,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Jerarquía de beneficios","recordType":"Evidencia externa","insight":"Sencillez, utilidad económica, flexibilidad y facilidad de uso pesan más que beneficios aspiracionales durante la decisión","evidence":"Deloitte: el 86% considera importantes o muy importantes las recompensas económicas, la sencillez y la facilidad de uso; 4 de cada 5 valora la flexibilidad. McKinsey, en elección aérea: precio 34%, equipaje 16%, asiento 10%, flexibilidad 9% y sala VIP 4%. Fuente: deskresearch_suma.pdf, p.4.","uxImplication":"En Fare Families conviene priorizar beneficios SUMA que resuelven necesidades inmediatas del viaje frente a ventajas menos decisivas en ese momento.","recommendation":"Dar prioridad visual a equipaje, asiento, flexibilidad, prioridad y ahorro directo cuando correspondan al usuario.","openQuestion":"¿Qué beneficios SUMA tienen mayor efecto real sobre la elección de tarifa en Air Europa?","origin":"Deloitte + McKinsey","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Fare Families · Beneficio tangible","observations":"Evidencia externa. Los pesos de elección pertenecen al estudio citado y no deben trasladarse como porcentajes propios de Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-3","sourceRow":6,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Reducción de esfuerzo","recordType":"Evidencia externa","insight":"La experiencia y la reducción de esfuerzo pueden ser más relevantes para la fidelidad que la acumulación de puntos por sí sola","evidence":"McKinsey concluye que en aerolíneas la experiencia tiene más del doble de influencia que los beneficios puramente tangibles sobre la frecuencia de compra. El informe traduce esta idea en evitar repetir datos, recordar condiciones o descubrir beneficios tarde. Fuente: deskresearch_suma.pdf, p.5.","uxImplication":"SUMA puede aportar valor como capa de servicio que reduce fricción, no solo como sistema de Millas.","recommendation":"Usar la identificación del miembro para eliminar tareas repetitivas y prevenir errores durante el booking.","openQuestion":"¿Qué fricciones del booking pueden eliminarse hoy con los datos y derechos ya conocidos del usuario SUMA?","origin":"McKinsey","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Servicio · Reducción de esfuerzo","observations":"Evidencia externa con aplicación inferida al booking de Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-4","sourceRow":7,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Personalización SUMA","element":"Orden de personalización","recordType":"Evidencia externa","insight":"La personalización aporta más valor cuando primero simplifica y da control, y solo después recomienda productos","evidence":"McKinsey destaca asistencia práctica y control frente a una gran cantidad de recomendaciones; IATA señala velocidad, comodidad y herramientas digitales como prioridades. Fuente: deskresearch_suma.pdf, p.6.","uxImplication":"La información del miembro debería utilizarse primero para aplicar derechos, simplificar formularios y evitar ofertas incompatibles o redundantes.","recommendation":"Ordenar la personalización en este orden: servicio y claridad → relevancia → recomendación comercial.","openQuestion":"¿Qué recomendaciones actuales podrían resultar redundantes una vez aplicados automáticamente los beneficios SUMA?","origin":"McKinsey + IATA","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Personalización · Servicio antes que venta","observations":"Evidencia externa. No valida una arquitectura concreta de personalización para Air Europa.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-5","sourceRow":8,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Tipos de valor","recordType":"Evidencia externa","insight":"Los beneficios de fidelización pueden leerse como reconocimiento, conveniencia y exploración","evidence":"La literatura académica revisada distingue reconocimiento, conveniencia y exploración; el informe recomienda dar más peso a reconocimiento y conveniencia durante la compra. Fuente: deskresearch_suma.pdf, p.7.","uxImplication":"Durante el booking conviene hacer explícito que el usuario está reconocido y qué fricción concreta se le evita; las ventajas aspiracionales pueden quedar en segundo plano.","recommendation":"Diseñar mensajes de beneficio que expliquen reconocimiento y conveniencia antes que beneficios aspiracionales.","openQuestion":"¿Qué momentos del booking necesitan comunicar reconocimiento y cuáles necesitan comunicar una ventaja operativa concreta?","origin":"Investigación académica sobre frequent flyer","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Reconocimiento · Conveniencia · Exploración","observations":"Marco conceptual externo. No implica que las tres dimensiones deban tener la misma presencia en todas las pantallas.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-6","sourceRow":9,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Earn de Millas","recordType":"Evidencia externa","insight":"El usuario necesita entender antes de pagar cuánto ganará y cómo cambia la acumulación entre opciones","evidence":"Collinson identifica falta de transparencia sobre puntos y umbrales como fricción. El caso KM Malta propone mostrar earn and burn por tarifa y extra antes del pago. Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"La acumulación de Millas puede formar parte de la comparación de Fare Families si se comunica de forma comprensible y condicionada.","recommendation":"Explorar Millas estimadas por tarifa y diferencias relativas entre opciones cuando el cálculo sea fiable.","openQuestion":"¿Amadeus permite calcular de forma suficientemente estable las Millas estimadas antes de seleccionar tarifa?","origin":"Collinson + caso KM Malta","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Millas · Earn antes de pagar","observations":"El caso KM Malta procede de un proveedor tecnológico y no es evidencia independiente de impacto.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-7","sourceRow":10,"product":"Booking","funnel":"Booking","minifunnel":"Equipaje","screen":"Equipaje","component":"Beneficio SUMA","element":"Pieza adicional","recordType":"Hecho","insight":"Silver, Gold y Platinum disponen de una pieza adicional de equipaje en bodega según las condiciones SUMA revisadas","evidence":"El informe recoge que Silver, Gold y Platinum pueden añadir una pieza adicional de equipaje en bodega. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"En Equipaje, el sistema necesita reconocer el nivel y traducirlo en una ventaja concreta para el pasajero correspondiente.","recommendation":"Mostrar y, cuando sea técnicamente posible, aplicar automáticamente la pieza incluida indicando que procede de SUMA.","openQuestion":"¿Qué condiciones de ruta, operador, tarifa o pasajero limitan la aplicación automática de esta pieza?","origin":"Condiciones SUMA revisadas en el desk research","channelEnvironment":"Desktop + mobile","market":"España / mercados SUMA","uxLine":"EXTRAS · Equipaje · Beneficio por nivel","observations":"Hecho recogido por el informe; la aplicabilidad final depende de condiciones específicas y debe validarse contra la fuente de verdad vigente.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-8","sourceRow":11,"product":"Booking","funnel":"Booking","minifunnel":"Asientos","screen":"Asientos","component":"Beneficio SUMA","element":"Gratuidad / descuento","recordType":"Hecho","insight":"Los beneficios de asiento cambian por nivel SUMA y por momento de la reserva","evidence":"Silver dispone de asiento estándar gratuito dentro de las 48 horas anteriores al vuelo y 20% de descuento en asientos XL; Gold y Platinum disponen de reserva gratuita de todos los tipos de asiento. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"El plano de asientos debe resolver correctamente nivel, tipo de asiento y momento temporal antes de mostrar precio o gratuidad.","recommendation":"Explicar de forma visible cuándo un asiento es gratis o tiene descuento por SUMA y evitar presentar como pago algo ya cubierto.","openQuestion":"¿Qué estados necesita el seat map para mostrar beneficio disponible, condicionado, todavía no disponible o no aplicable?","origin":"Condiciones SUMA revisadas en el desk research","channelEnvironment":"Desktop + mobile","market":"España / mercados SUMA","uxLine":"EXTRAS · Asientos · Beneficio por nivel","observations":"Hecho condicionado. No debe generalizarse el mismo patrón UX de equipaje a asientos porque la lógica de inventario y temporalidad es distinta.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-9","sourceRow":12,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Beneficios de prioridad","element":"Fast Track / sala VIP / prioridad","recordType":"Hecho","insight":"Los beneficios de prioridad, Fast Track, recogida prioritaria, sala VIP y upgrades dependen del nivel y de condiciones adicionales","evidence":"Silver, Gold y Platinum tienen facturación Business y embarque prioritario; Gold y Platinum añaden Fast Track, recogida prioritaria y acceso a salas VIP bajo condiciones; Platinum puede acceder a upgrades sujetos a disponibilidad. Fuente: deskresearch_suma.pdf, p.9.","uxImplication":"No todos los beneficios son binarios ni están disponibles en el mismo momento del journey.","recommendation":"Comunicar disponibilidad y condiciones en el punto del journey donde el beneficio pueda utilizarse, evitando prometerlo como universal.","openQuestion":"¿Qué beneficios pueden confirmarse durante booking y cuáles solo en aeropuerto, check-in u otros contextos?","origin":"Condiciones SUMA revisadas en el desk research","channelEnvironment":"Desktop + mobile","market":"España / mercados SUMA","uxLine":"Prioridad · Beneficios condicionados","observations":"Patrón transversal: parte de estos beneficios afecta también a Check-in y aeropuerto, no solo a Booking.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-10","sourceRow":13,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Motor de beneficios SUMA","element":"Reglas de aplicabilidad","recordType":"Inferencia","insight":"La aplicabilidad de un beneficio SUMA no puede resolverse solo con el nivel del usuario","evidence":"El informe identifica como variables: nivel SUMA, pasajero, tarifa, vuelo/segmento, aerolínea operadora, ruta nacional/internacional, momento de solicitud, disponibilidad, otros descuentos/promociones y reglas SkyTeam. Fuente: deskresearch_suma.pdf, pp.9–10.","uxImplication":"La lógica de beneficios necesita ser pasajero + segmento + contexto, y no un simple badge de estado.","recommendation":"Modelar las reglas de beneficio con condiciones explícitas y estados aplicable / condicionado / no disponible / no aplicable.","openQuestion":"¿Qué variables están disponibles en tiempo real durante cada paso del booking y cuáles requieren servicios adicionales?","origin":"Desk research SUMA","channelEnvironment":"Desktop + mobile","market":"España + internacional","uxLine":"Reglas · Pasajero + segmento + contexto","observations":"Inferencia directamente apoyada en las condiciones recopiladas. Es especialmente relevante para extras multipasajero y por segmento.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-11","sourceRow":14,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Fuente de verdad SUMA","element":"Consistencia de reglas","recordType":"Evidencia interna","insight":"Mantener reglas y condiciones SUMA en múltiples lugares aumenta el riesgo de inconsistencias","evidence":"El informe detecta una posible discrepancia entre páginas oficiales: España indica caducidad tras 24 meses de inactividad y algunas versiones de otros mercados todavía muestran 18 meses. Fuente: deskresearch_suma.pdf, p.10.","uxImplication":"Booking no debería replicar manualmente reglas de fidelización que también viven en Mi Cuenta, Check-in, app y páginas informativas.","recommendation":"Definir una fuente central de verdad para reglas y contenidos de beneficios que pueda consumirse desde los distintos canales.","openQuestion":"¿Qué sistema debe gobernar las reglas SUMA y qué superficies consumen hoy copias manuales?","origin":"Revisión de contenidos oficiales Air Europa","channelEnvironment":"Desktop + mobile","market":"España + internacional","uxLine":"Gobernanza · Fuente única de verdad","observations":"La discrepancia puede deberse a contenido desactualizado; el hallazgo demuestra riesgo de gobernanza, no cuál es la condición correcta.","impactUx":"Alto","extraFields":{"Login":"Ambos","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-12","sourceRow":15,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"SUMA / beneficios","element":"Integración en el journey","recordType":"Inferencia","insight":"La principal oportunidad es convertir SUMA en una capa de servicio integrada en la compra, no añadir más mensajes promocionales","evidence":"El resumen ejecutivo plantea que el pasajero identificado debería entender nivel, beneficios aplicables, inclusiones de tarifa, aportación SUMA, descuentos, condiciones y Millas sin consultar otra página. Fuente: deskresearch_suma.pdf, p.2.","uxImplication":"La fidelización debe aparecer donde modifica una decisión o reduce esfuerzo, no como comunicación paralela.","recommendation":"Integrar la información SUMA en Fare Families, Paxes, EXTRAS y Summary utilizando el contexto de cada pantalla.","openQuestion":"¿Qué información SUMA es imprescindible en cada minifunnel y cuál sería redundante?","origin":"Síntesis del desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Integración transversal · Servicio","observations":"Inferencia del informe a partir de varias fuentes. No equivale a una solución visual validada.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-13","sourceRow":16,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Tarifa vs SUMA","recordType":"Oportunidad","insight":"En Fare Families debería distinguirse qué incluye la tarifa, qué añade SUMA y cuál es el resultado final para el pasajero","evidence":"Las conclusiones indican que es necesario diferenciar inclusión de tarifa, aportación del nivel SUMA y resultado final por pasajero. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"Sin esta separación el usuario puede atribuir un beneficio al producto equivocado o no entender el valor real de su nivel.","recommendation":"Estructurar cada tarifa con una capa específica de beneficios SUMA, evitando duplicar o mezclar inclusiones.","openQuestion":"¿Qué formato permite comparar tarifa y SUMA sin aumentar la densidad de Fare Families?","origin":"Conclusiones del desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fare Families · Proveniencia del beneficio","observations":"Oportunidad de diseño. Debe contrastarse con limitaciones de Amadeus y con el UI Kit.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-14","sourceRow":17,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Dispo","component":"Fare Families","element":"Millas estimadas","recordType":"Oportunidad","insight":"Mostrar Millas estimadas por tarifa puede hacer visible parte del valor futuro antes de elegir","evidence":"El informe propone ejemplos como «Conseguirás aproximadamente 1.840 Millas SUMA» y «Esta tarifa genera un 50% más de Millas que la tarifa anterior». Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"La acumulación puede actuar como información comparativa si no compite con precio e inclusiones principales.","recommendation":"Explorar una comunicación secundaria de earn estimado por tarifa, usando «aproximadamente» o «estimadas» cuando proceda.","openQuestion":"¿La estimación puede calcularse con suficiente precisión antes de completar todos los datos del viaje?","origin":"Aplicación propuesta en el desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Fare Families · Earn estimado","observations":"Propuesta no validada. El propio informe recomienda lenguaje de estimación cuando el cálculo final dependa de condiciones posteriores.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-15","sourceRow":18,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Pasajeros","component":"Datos del pasajero / SUMA","element":"Prerrelleno","recordType":"Oportunidad","insight":"La identificación SUMA puede reducir esfuerzo si evita volver a introducir datos ya conocidos","evidence":"El informe cita el caso KM Malta, que comunica una reducción de 40–60 segundos al prerrellenar datos de miembros. Fuente: deskresearch_suma.pdf, p.5.","uxImplication":"Paxes es un punto claro donde la fidelización puede convertirse en servicio y no solo en comunicación.","recommendation":"Recuperar de forma segura los datos disponibles del miembro, permitiendo revisión y edición antes de continuar.","openQuestion":"¿Qué datos de pasajero puede recuperar Air Europa hoy y qué restricciones de consentimiento o actualización existen?","origin":"Caso KM Malta / proveedor tecnológico","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Paxes · Prerrelleno · Reducción de esfuerzo","observations":"Caso de proveedor, no estudio independiente. Debe tratarse como referencia, no como promesa de ahorro equivalente.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-16","sourceRow":19,"product":"Booking","funnel":"Booking","minifunnel":"Equipaje","screen":"Equipaje","component":"Beneficio SUMA","element":"Aplicación automática y origen","recordType":"Oportunidad","insight":"En Equipaje conviene aplicar automáticamente el derecho SUMA cuando sea posible y explicar de dónde procede","evidence":"Las conclusiones recomiendan aplicar ventajas automáticamente para evitar que el usuario pague por un servicio ya incluido; el informe identifica equipaje como uno de los beneficios más relevantes. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"La experiencia debe evitar doble pago y, al mismo tiempo, hacer visible que la ventaja proviene del nivel SUMA y no de la tarifa.","recommendation":"Mostrar estado aplicado, pasajero afectado y procedencia del beneficio antes de ofrecer equipaje adicional de pago.","openQuestion":"¿Cómo se resuelve el beneficio cuando solo algunos pasajeros del PNR son elegibles o cambia por segmento?","origin":"Conclusiones del desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Equipaje · Autoaplicación","observations":"Oportunidad específica para un extra de cantidad/multipasajero; no debe extrapolarse sin cambios a otros ancillaries.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-17","sourceRow":20,"product":"Booking","funnel":"Booking","minifunnel":"Asientos","screen":"Asientos","component":"Beneficio SUMA","element":"Aplicación automática y origen","recordType":"Oportunidad","insight":"En Asientos conviene reflejar gratuidad o descuento SUMA directamente en la selección y explicar la condición aplicada","evidence":"El informe prioriza asiento gratuito o con descuento como beneficio práctico y concluye que las ventajas deben aplicarse automáticamente cuando sea posible. Fuente: deskresearch_suma.pdf, pp.4 y 11.","uxImplication":"El usuario debería entender el precio final del asiento sin tener que recordar las condiciones de su nivel.","recommendation":"Indicar por pasajero y tipo de asiento si el beneficio está aplicado, condicionado por tiempo o no disponible.","openQuestion":"¿Cómo debe representarse la gratuidad futura de Silver dentro de las 48 h sin inducir a error antes de ese momento?","origin":"Desk research SUMA","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"EXTRAS · Asientos · Autoaplicación","observations":"Oportunidad específica para un extra de inventario limitado y pasajero + segmento; requiere patrón propio.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-18","sourceRow":21,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Summary / Shopping cart","component":"Resumen de Millas","element":"Earn, burn y progreso","recordType":"Oportunidad","insight":"El Summary puede reunir cuánto gana el usuario, cuánto puede utilizar y su progreso hacia el siguiente nivel","evidence":"El informe propone mostrar Millas que se obtendrán, Millas utilizables y progreso como «Después de este viaje te faltarán 2 vuelos para alcanzar Silver». Fuente: deskresearch_suma.pdf, pp.8 y 11.","uxImplication":"El resumen es un punto natural para cerrar el valor de SUMA antes de pagar, siempre que la información no opaque precio y total.","recommendation":"Separar claramente ahorro actual, Millas utilizadas, Millas estimadas a obtener y progreso de nivel.","openQuestion":"¿Qué parte de esta información es calculable con certeza antes del pago y qué parte debe mostrarse como estimada?","origin":"Aplicación propuesta en el desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Summary · Valor acumulado de SUMA","observations":"Oportunidad no validada. Debe coordinarse con el análisis específico ya existente del Slider de Millas.","impactUx":"Alto","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-19","sourceRow":22,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Umbral y estimación","recordType":"Hecho","insight":"El pago mixto de vuelos operados por Air Europa requiere actualmente un mínimo de 1.500 Millas","evidence":"El informe recoge que Air Europa establece un mínimo de 1.500 Millas para el pago mixto de vuelos operados por la compañía. Fuente: deskresearch_suma.pdf, p.8.","uxImplication":"El Slider debe comunicar el umbral y diferenciar con claridad disponibilidad real de Millas y valor aplicable a la compra.","recommendation":"Mantener el umbral visible en el contexto de uso y usar lenguaje de estimación cuando el cálculo dependa de condiciones posteriores.","openQuestion":"¿Existen rutas, operadores o mercados donde el mínimo o la lógica de pago mixto cambie?","origin":"Condición Air Europa recogida en el desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Summary · Slider de Millas · Reglas","observations":"Hecho citado por el informe. Debe validarse contra la fuente de verdad vigente antes de convertirlo en regla permanente de UI.","impactUx":"Medio","extraFields":{"Login":"Logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-20","sourceRow":23,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Login contextual","component":"Login / SUMA","element":"Beneficio previo al login","recordType":"Oportunidad","insight":"Para usuarios no identificados, comunicar un beneficio concreto y contextual puede incentivar el login o registro sin convertirlo en el objetivo principal","evidence":"Las conclusiones indican que para usuarios no identificados comunicar beneficios concretos y contextuales puede incentivar el registro, aunque no sea el objetivo principal del proyecto. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"El login puede ganar valor cuando aparece ligado a una ventaja inmediata del paso actual.","recommendation":"Usar mensajes contextuales del tipo «Inicia sesión para aplicar tus beneficios SUMA» solo cuando exista una ventaja relevante en ese punto.","openQuestion":"¿Qué momentos generan suficiente valor para pedir identificación sin interrumpir la tarea principal?","origin":"Conclusiones del desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Login contextual · Activación de beneficios","observations":"Oportunidad; no demuestra impacto en registro ni conversión. Debe evitarse convertir el booking en una campaña de captación.","impactUx":"Medio","extraFields":{"Login":"No logado","Iniciativa":"Usuarios SUMA"},"initiative":"Usuarios SUMA"},{"id":"IR-21","sourceRow":24,"product":"Booking","funnel":"Booking","minifunnel":"","screen":"Multipantalla","component":"Motor de beneficios SUMA","element":"Viabilidad técnica","recordType":"Pregunta abierta","insight":"Antes de diseñar la solución es necesario confirmar qué información y reglas pueden resolverse realmente durante el booking","evidence":"El informe cierra señalando la necesidad de confirmar qué información proporciona Amadeus, qué reglas pueden calcularse durante la compra y qué limitaciones técnicas existen. Fuente: deskresearch_suma.pdf, p.11.","uxImplication":"La calidad de la experiencia dependerá de disponer de reglas fiables en tiempo real; sin ello, una interfaz muy explícita puede prometer beneficios incorrectos.","recommendation":"Mapear datos disponibles, responsables de cada ","market":"No especificado","uxLine":"Personalización; Contenido y copy","observations":"La auditoría no demuestra impacto en conversión. Conviene no aumentar la carga visual antes del buscador.","impactUx":"Medio","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-2","sourceRow":5,"product":"Booking","screen":"Disponibilidad","component":"Fare Families","element":"","recordType":"Insight UX","insight":"La selección de tarifa no aprovecha que el usuario está identificado para hacer visible el valor SUMA","evidence":"Las tarifas muestran precio y servicios incluidos, pero no beneficios del nivel SUMA ni las Millas asociadas a cada opción.","uxImplication":"En mobile la comparación es secuencial y el espacio es limitado; el valor SUMA debe aparecer en el propio punto de decisión y de forma muy sintética.","recommendation":"Mostrar Millas y beneficios aplicables por nivel, diferenciando claramente beneficio de tarifa y beneficio SUMA.","openQuestion":"¿Amadeus permite recuperar antes de seleccionar tarifa los beneficios y Millas aplicables de forma dinámica según nivel SUMA?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Personalización; Claridad y comprensión","observations":"Pendiente de validación técnica con Amadeus.","impactUx":"Alto","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-3","sourceRow":6,"product":"Booking","screen":"Disponibilidad","component":"Upsell Panel","element":"","recordType":"Insight UX","insight":"El upsell explica el salto de tarifa, pero no incorpora el valor adicional de SUMA","evidence":"El modal compara precio y servicios de la tarifa seleccionada con una opción superior, sin mostrar ventajas SUMA ni Millas potenciales.","uxImplication":"SUMA puede aportar un argumento adicional de valor en el momento de upgrade, pero cualquier contenido extra debe ser breve por la limitación de espacio mobile.","recommendation":"Incorporar beneficios aplicables y Millas estimadas cuando estén disponibles, separándolos de los servicios propios de la tarifa.","openQuestion":"¿Amadeus puede recuperar dentro del upsell beneficios por nivel y acumulación de Millas antes de confirmar el cambio?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Personalización; Claridad y comprensión","observations":"Pendiente de validación técnica. Evitar sobrecargar el modal.","impactUx":"Alto","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-4","sourceRow":7,"product":"Booking","screen":"Resumen","component":"Cash & Miles","element":"","recordType":"Insight UX","insight":"El CTA sticky puede permitir avanzar sin que el usuario llegue a descubrir Cash & Miles","evidence":"El bloque de canje está integrado en el resumen, pero el CTA \"Continuar\" permanece visible durante el scroll y puede utilizarse antes de visualizar la opción de Millas.","uxImplication":"La posición del componente es adecuada, pero en mobile su exposición no está garantizada; esto puede reducir el descubrimiento de una funcionalidad relevante para SUMA.","recommendation":"Asegurar que Cash & Miles quede expuesto antes de avanzar y que el mensaje previo al canje explique con claridad qué puede hacer el usuario.","openQuestion":"¿Podemos garantizar la exposición del bloque Cash & Miles antes de que el CTA sticky permita abandonar el paso?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Encontrabilidad; Jerarquía visual","observations":"El detalle de interacción, estados y errores del slider se mantiene en su auditoría específica para evitar duplicidades.","impactUx":"Alto","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-5","sourceRow":8,"product":"Booking","screen":"Pasajeros","component":"Perfil SUMA","element":"","recordType":"Insight UX","insight":"La recuperación automática del perfil funciona bien, pero la interfaz puede confirmar mejor que SUMA ya está aplicado","evidence":"Los datos personales y el número SUMA se recuperan automáticamente, reduciendo esfuerzo, aunque el bloque \"Añadir tarjeta de pasajero frecuente\" puede interpretarse como una acción pendiente.","uxImplication":"Aquí no hace falta promocionar más SUMA; basta con eliminar incertidumbre sobre el estado del perfil y mantener continuidad con la sesión iniciada.","recommendation":"Reforzar de forma ligera el estado de asociación del número SUMA y mantener la recuperación automática como comportamiento por defecto.","openQuestion":"¿Puede el bloque de pasajero frecuente representar un estado confirmado cuando el número SUMA ya está asociado?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Feedback y estado","observations":"La incidencia anterior del pasajero 2 ya fue corregida y no se registra como insight pendiente.","impactUx":"Bajo","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-6","sourceRow":9,"product":"Booking","screen":"Extras","component":"Cards de extras","element":"","recordType":"Insight UX","insight":"Los beneficios SUMA no se anticipan antes de entrar en cada extra","evidence":"Asientos, equipaje o embarque prioritario pueden estar incluidos por nivel, pero la card no indica qué tiene gratis el usuario ni que debe entrar para seleccionarlo.","uxImplication":"En una pantalla mobile extensa, depender del minifunnel para descubrir la ventaja reduce la probabilidad de que el usuario reconozca y utilice su beneficio.","recommendation":"Mostrar en cada card un estado breve como \"Incluido por tu nivel SUMA\", indicando que debe seleccionarse y para qué pasajero aplica.","openQuestion":"¿Podemos recuperar los beneficios asociados al nivel antes de entrar en cada minifunnel y vincularlos al pasajero correspondiente?","origin":"Auditoría UX","c ciones ya presentes en desktop.","Quantum Metric; Data: En mobile la interacción se concentra todavía más en la construcción secuencial de la búsqueda","Quantum Metric; Data: Mobile genera más búsquedas pero presenta mayor abandono entre búsqueda y resultados","Quantum Metric; Data: Desktop presenta una transición más eficiente hacia Disponibilidad en el periodo analizado","Desk research: Mobile necesita una interacción propia y no una versión comprimida de desktop","Desk research: La consistencia debe mantenerse a nivel conceptual sin forzar una interacción idéntica entre dispositivos","Auditoría UX: Mobile amplifica el peso de elementos secundarios y capas previas a la búsqueda","Quantum Metric; Heurística: Mobile debe tratarse como una experiencia específica por la secuencia y el esfuerzo táctil","Benchmark: Mobile necesita una entrada más reducida o secuencial que desktop","Benchmark: El avance guiado cobra más valor en mobile porque reduce pasos manuales"],"contrary":["El diferencial de abandono no permite atribuir la causa al buscador por sí solo.","Los resultados de Header confirman que el comportamiento por dispositivo puede divergir; lo observado en mobile no debe extrapolarse a desktop."],"noProof":["No valida un flujo automático paso a paso concreto.","No demuestra que una única secuencia funcione igual para todos los mercados, segmentos o tipos de viaje."],"open":["¿Qué secuencia mobile reduce esfuerzo sin dificultar revisión, corrección o vuelta atrás?"],"applications":["Buscador mobile","Secuenciación","Edición y revisión","Responsive","Header mobile","Home","Buscador","Flujo y secuenciación","Fricción y eficiencia","Consistencia","Header"],"sourceNames":["BUSCADOR_02_Auditoria_UX","BUSCADOR_03_Desk_Research","BUSCADOR_04_Analisis_Heuristico_QM","BUSCADOR_05_Analisis_Conductual","BUSCADOR_06_Benchmark","BUSCADOR_07_Datos_QM","Resultados test A/B mobile","Resultados test A/B desktop","Desk research","Auditoría heurística","Análisis y recogida de inputs" ción relevante: resolver tareas operativas","Quantum Metric; Data: Los shortcuts de autogestión mantienen uso en mobile aunque su peso relativo sea menor que el buscador","Auditoría UX: El autoservicio forma parte del valor de la Home y no debe desaparecer al reforzar el buscador","Auditoría UX: En mobile los accesos rápidos son útiles, pero pueden necesitar un tratamiento más compacto","Quantum Metric; Heurística: La Home combina intención de compra y autogestión","Benchmark: La Home también debe facilitar tareas operativas, pero con jerarquía secundaria"],"contrary":["El volumen de interacción varía por dispositivo y no mide el éxito posterior de la tarea.","En desktop, mejorar autoservicio no garantiza conservar el mismo rendimiento de Buscar; la relación debe evaluarse como sistema."],"noProof":["No demuestra reducción de llamadas, menor esfuerzo o mejora de CES.","No determina una ubicación exacta para cada acceso.","La mejora de clics no demuestra por sí sola menor esfuerzo, éxito de tarea, reducción de llamadas o mejora de CES."],"open":["¿Qué jerarquía y ubicación preservan encontrabilidad sin competir con Buscar vuelos?","¿Qué ocurre después del clic en cada tarea de autoservicio?"],"applications":["Accesos rápidos","Header","Check-in","Gestiona tu reserva","Información de vuelo","Home","Arquitectura de información","Encontrabilidad","Above the fold","Jerarquía visual","Fricción y eficiencia"],"sourceNames":["BUSCADOR_02_Auditoria_UX","BUSCADOR_04_Analisis_Heuristico_QM","BUSCADOR_06_Benchmark","BUSCADOR_07_Datos_QM","Test con usuarios","Análisis y recogida de inputs","Resultados test A/B mobile","Resultados test A/B desktop","Auditoría heurística","Analisis Heurístico","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-13","publicationHistory":[{"documentId":"IR-1789810207336","sourceName":"Análisis y recogida de inputs","decision":"Reforzar learning existente","publishedAt":"2026-09-21T06:26:02.425Z","rowRefs":[9,10

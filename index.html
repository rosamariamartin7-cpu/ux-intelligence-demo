illas","element":"Estado sin activar · propuesta de valor","userState":"Logado","recordType":"Evidencia interna","insight":"El estado sin activar informa de Millas disponibles pero no explica desde qué cantidad pueden usarse ni su efecto sobre el precio","evidence":"Antes de activar, el componente no comunica mínimo de canje ni impacto económico potencial.","uxImplication":"El usuario conoce que tiene Millas, pero no puede valorar fácilmente si le interesa utilizar el canje en esa reserva.","recommendation":"Explicar desde qué cantidad puede empezar a usar Millas y, si el dato es fiable, conectar el canje con su reducción económica.","openQuestion":"¿Puede Amadeus devolver el mínimo de canje y una equivalencia económica fiable antes de activar el componente?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Descubrimiento del canje","observations":"No implica que deba mostrarse siempre una equivalencia en euros; depende de disponibilidad y fiabilidad del dato.","source":"flujo_millasslider.pdf · p.3","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-4","sourceRow":7,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Copy previo al canje","userState":"Logado","recordType":"Oportunidad","insight":"La propuesta inicial puede tener una versión con o sin equivalencia económica según la capacidad técnica","evidence":"La auditoría propone «Tienes 96.360 Millas disponibles. Puedes utilizarlas en este viaje desde 7.040 Millas» y una variante que añade «reduce el precio desde 29,22 €».","uxImplication":"La equivalencia en euros puede hacer más tangible el beneficio, pero solo debe utilizarse si el cálculo es estable y fiable.","recommendation":"Priorizar la versión con equivalencia económica cuando el dato esté disponible y usar la versión sin ahorro en caso contrario.","openQuestion":"¿La equivalencia económica puede cambiar antes de seleccionar una cantidad y cómo se garantiza que no genere expectativas erróneas?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Medio","uxLine":"Descubrimiento del canje","observations":"Propuesta UX no validada. La versión con ahorro depende de una capacidad técnica explícita.","source":"flujo_millasslider.pdf · pp.7–8","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-5","sourceRow":8,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Estado activado · 0 Millas","userState":"Logado","recordType":"Evidencia interna","insight":"Mostrar «0 Millas» inmediatamente después de activar el canje contradice la intención del usuario","evidence":"El usuario activa el toggle para utilizar Millas, pero el componente responde con «0 Millas» tanto en campo como en slider.","uxImplication":"El estado activado no confirma una acción útil ni explica claramente que todavía falta seleccionar una cantidad.","recommendation":"Evitar «0 Millas» como estado principal y utilizar una selección pendiente clara o aplicar automáticamente el mínimo si es viable.","openQuestion":"¿Puede Amadeus aplicar automáticamente el mínimo permitido al activar el canje?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Estado activado","observations":"El problema es de estado inicial y guía, no necesariamente del funcionamiento posterior.","source":"flujo_millasslider.pdf · p.4","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-6","sourceRow":9,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Selector de cantidad","userState":"Logado","recordType":"Evidencia interna","insight":"El campo de cantidad parece editable aunque el usuario solo puede seleccionar valores permitidos","evidence":"El campo sugiere entrada manual, pero el canje funciona mediante cantidades válidas del desplegable o tramos del slider; además, el valor 0 debe borrarse para abrir opciones, error ya trasladado a Amadeus.","uxImplication":"La affordance del control no corresponde con su comportamiento real y puede inducir a probar una interacción que no está disponible.","recommendation":"Presentar el campo como selector no editable, con affordance de desplegable y sin exigir borrar el valor actual.","openQuestion":"¿Qué comportamiento puede modificarse en Amadeus para evitar la falsa editabilidad y el error asociado al valor 0?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Selección de cantidad","observations":"Incluye una incidencia funcional ya trasladada a Amadeus.","source":"flujo_millasslider.pdf · pp.4, 9","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-7","sourceRow":10,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Sincronización selector-slider","userState":"Logado","recordType":"Evidencia interna","insight":"La sincronización entre selector y slider funciona y no es el problema principal a resolver","evidence":"La auditoría específica indica que selector y slider funcionan correctamente y se mantienen sincronizados.","uxImplication":"Conviene preservar este comportamiento y concentrar la mejora en el estado inicial, la affordance del selector y la explicación de cantidades válidas.","recommendation":"Mantener sincronización bidireccional y evitar rediseños que introduzcan incoherencia entre ambos controles.","openQuestion":"¿La sincronización se mantiene en todos los rangos, saldos y combinaciones de canje?","origin":"Auditoría UX","channelEnvironment":"Desktop", mula en lugar de confirmar directamente el resultado","evidence":"La fórmula «19.800 Millas + 466,46 €» mezcla Millas utilizadas, importe restante, precio original y ahorro.","uxImplication":"El usuario debe reconstruir mentalmente cuánto usa, cuánto conserva, cuánto ahorra y cuánto paga.","recommendation":"Confirmar explícitamente Millas utilizadas, saldo restante, ahorro y total a pagar.","openQuestion":"¿Qué valores puede devolver Amadeus de forma consistente una vez seleccionada la cantidad?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Resultado del canje","observations":"El objetivo es comunicar el resultado, no explicar el cálculo técnico interno.","source":"flujo_millasslider.pdf · p.5","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-10","sourceRow":13,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Componente y footer","userState":"Logado","recordType":"Evidencia interna","insight":"El resultado económico se reparte entre el componente y el footer y genera duplicidad de responsabilidades","evidence":"El componente y el footer muestran partes del resultado del canje, por lo que no queda claro dónde leer ahorro, precio original y total final.","uxImplication":"La duplicidad aumenta el esfuerzo de lectura y dificulta establecer una fuente principal para cada dato.","recommendation":"Separar responsabilidades: componente para gestión del canje y footer para resumen económico final.","openQuestion":"¿Qué información debe permanecer junto al control para dar feedback inmediato sin duplicar el footer?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Arquitectura de información del canje","observations":"Hallazgo visual y de jerarquía; no implica eliminar feedback inmediato del componente.","source":"fl ket":"No especificado","impactUx":"Medio","uxLine":"Acceso e identificación SUMA","observations":"Hallazgo positivo. La auditoría documenta desktop; no demuestra comportamiento mobile.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.3","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-2","sourceRow":5,"product":"Booking","funnel":"Booking","minifunnel":"Home / acceso","screen":"Home","component":"Login / autenticación","element":"Mensaje previo al login","userState":"No logado","recordType":"Evidencia interna","insight":"El mensaje previo al login no concreta qué valor obtiene el usuario durante la reserva","evidence":"La Home invita a iniciar sesión para «disfrutar de sus ventajas», pero no explica qué ventajas son relevantes para el proceso de compra.","uxImplication":"Un mensaje genérico reduce la capacidad del usuario para anticipar por qué le conviene identificarse antes de buscar.","recommendation":"Explicar de forma breve que el acceso permite consultar Millas y aprovechar ventajas SUMA durante la reserva.","openQuestion":"¿Qué beneficio concreto de SUMA aporta más valor para incentivar el login antes de iniciar la búsqueda?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Medio","uxLine":"Acceso e identificación SUMA","observations":"La propuesta de copy es una oportunidad UX; no está validada mediante test o CRO.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.3","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-3","sourceRow":6,"product":"Booking","funnel":"Booking","minifunnel":"Availability/Dispo","screen":"Availability/Dispo","component":"Fare Families","element":"Beneficios SUMA por tarifa","userState":"Logado","recordType":"Evidencia interna","insight":"La comparación de Fare Families no utiliza el contexto SUMA del usuario identificado","evidence":"El usuario llega identificado a Disponibilidad, pero las Fare Families no muestran Millas a acumular, beneficios por nivel ni la diferencia entre lo incluido por tarifa y lo obtenido por SUMA.","uxImplication":"La personalización existe a nivel de cuenta, pero no se traduce en información útil en un momento clave de decisión.","recommendation":"Explorar una comunicación breve por tarifa que diferencie acumulación, inclusiones de Fare Family y beneficios por nivel SUMA.","openQuestion":"¿Qué datos de acumulación y beneficios puede devolver Amadeus antes de seleccionar la tarifa y cómo varían por Fare Family?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Beneficios SUMA en Fare Families","observations":"Pendiente de validación técnica con Amadeus. La auditoría no demuestra impacto sobre elección de tarifa o conversión.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.4","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-4","sourceRow":7,"product":"Booking","funnel":"Booking","minifunnel":"Availability/Dispo","screen":"Availability/Dispo","component":"Login / autenticación","element":"Recuperación de login","userState":"No logado","recordType":"Oportunidad","insight":"Availability podría ofrecer una recuperación contextual del login para usuarios no identificados","evidence":"La auditoría plantea recuperar un acceso al login en esta pantalla, tomando como referencia el patrón observado en Iberia.","uxImplication":"El login contextual puede ser útil si permite identificar al usuario sin perder la búsqueda ni el estado del flujo.","recommendation":"Valorar un acceso contextual a login en Availability únicamente si la sesión puede recuperarse sin reiniciar ni degradar el proceso.","openQuestion":"¿Puede activarse el login en Availability sin perder búsqueda, selección ni estado del booking?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Medio","uxLine":"Login contextual y recuperación de sesión","observations":"Oportunidad fuera del foco principal de usuarios logados. Requiere validación técnica y no debe tratarse como hallazgo confirmado.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.4","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-5","sourceRow":8,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Upsell Panel","component":"Upsell de tarifa","element":"Beneficios SUMA en mejora de tarifa","userState":"Logado","recordType":"Evidencia interna","insight":"El upsell de tarifa no incorpora el valor específico del usuario SUMA","evidence":"El modal compara servicios y diferencia de precio, pero no muestra ventajas SUMA por nivel ni Millas a acumular.","uxImplication":"El usuario puede evaluar una mejora de tarifa sin disponer de todo el valor que le corresponde por estar identificado.","recommendation":"Incorporar beneficios SUMA solo cuando sean relevantes y diferenciar claramente lo que aporta la tarifa de lo que ya corresponde por nivel.","openQuestion":"¿Qué beneficios SUMA pueden recuperarse dentro del modal y cuáles cambian realmente según la Fare Family?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Fidelización en upsell","observations":"Pendiente de disponibilidad de datos y cálculo previo en Amadeus.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.5","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-6","sourceRow":9,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Estado sin activar","userState":"Logado","recordType":"Evidencia interna","insight":"El estado inicial del Slider de Millas no explica con claridad qué puede hacer el usuario ni qué beneficio obtiene","evidence":"El bloque aparece en un momento adecuado, pero el título «Tus Millas», la jerarquía visual y el mensaje de saldo no explican la acción, el mínimo de canje ni su efecto sobre el precio.","uxImplication":"La disponibilidad de Millas se comunica sin convertirla en una propuesta de acción comprensible.","recommendation":"Reforzar propósito, mínimo de uso y beneficio del canje sin rediseñar necesariamente el componente.","openQuestion":"¿La cifra mostrada representa saldo total o máximo aplicable a la reserva y qué datos puede devolver Amadeus antes de activar el canje?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Canje de Millas","observations":"Este hallazgo se desarrolla con mayor detalle en la auditoría específica del Slider de Millas.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.6","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-7","sourceRow":10,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Slider de Millas","element":"Estado activado","userState":"Logado","recordType":"Evidencia interna","insight":"El estado activado del canje no guía con suficiente claridad ni explica bien las opciones disponibles","evidence":"Tras activar el canje aparecen «0 Millas», un campo con apariencia editable y un slider que puede sugerir opciones distintas a las realmente disponibles; el resultado económico se reparte entre componente y footer.","uxImplication":"El usuario debe interpretar cómo continuar y qué efecto produce la selección en lugar de recibir una guía explícita.","recommendation":"Tratar este registro como hallazgo marco y utilizar la auditoría específica del Slider para definir comportamiento, copy y jerarquía.","openQuestion":"¿Qué cantidades admite realmente el canje y cómo debe comunicarse el resultado económico sin ambigüedad?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Canje de Millas","observations":"No duplicar el detalle de la auditoría específica: esta fila conserva el contexto end-to-end y su relación con el journey.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.7","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-8","sourceRow":11,"product":"Booking","funnel":"Booking","minifunnel":"Passengers/Paxes","screen":"Passengers/Paxes","component":"Perfil de pasajero","element":"Autocompletado de datos SUMA","userState":"Logado","recordType":"Evidencia interna","insight":"La recuperación automática de datos personales y número SUMA reduce esfuerzo en Paxes","evidence":"Al indicar que la persona logada es quien viaja, el sistema recupera automáticamente sus datos personales y su número SUMA.","uxImplication":"La identificación aporta valor operativo real al reducir cumplimentación y reutilizar información del perfil.","recommendation":"Mantener la recuperación automática y hacer explícito qué información se ha aplicado correctamente.","openQuestion":"¿Qué datos del perfil SUMA pueden recuperarse de forma consistente en todos los casos de booking?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Personalización y reducción de fricción","observations":"Hallazgo positivo; convive con problemas de comunicación del estado aplicado.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.8","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-9","sourceRow":12,"product":"Booking","funnel":"Booking","minifunnel":"Passengers/Paxes","screen":"Passengers/Paxes","component":"Pasajero frecuente","element":"Estado de asociación SUMA","userState":"Logado","recordType":"Evidencia interna","insight":"La interfaz no confirma con claridad que el número SUMA ya está asociado al pasajero","evidence":"El bloque mantiene el título «Añadir tarjeta de pasajero frecuente» y un toggle con apariencia desactivada aunque programa y número SUMA ya estén informados.","uxImplication":"El estado visual contradice la situación real y puede hacer pensar que aún falta una acción.","recommendation":"Mostrar un estado confirmado, por ejemplo «Tu número SUMA se ha añadido a este pasajero», evitando affordances de acción cuando ya está aplicado.","openQuestion":"¿Qué patrón de confirmación permite distinguir con claridad estado aplicado, editable y pendiente?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Fidelización multipasajero","observations":"El problema es de estado y comunicación, no de recuperación del dato.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.8","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-10","sourceRow":13,"product":"Booking","funnel":"Booking","minifunnel":"Passengers/Paxes","screen":"Passengers/Paxes","component":"Perfil de pasajero","element":"Reutilización del perfil logado","userState":"Logado","recordType":"Evidencia interna","insight":"El perfil del usuario logado puede volver a ofrecerse en el pasajero 2 aunque ya esté asociado al pasajero 1","evidence":"La pantalla vuelve a mostrar «¿Eres tú el que viaja?» con el nombre del usuario SUMA al pasar al segundo pasajero.","uxImplication":"En reservas multipasajero, permitir reutilizar el mismo perfil puede generar dudas o una asignación incorrecta de datos.","recommendation":"Ocultar o deshabilitar la opción del perfil logado una vez asociado a un pasajero, manteniendo la posibilidad de añadir un número de viajero frecuente propio al resto.","openQuestion":"¿Qué regla técnica garantiza que un perfil identificado solo pueda asociarse al pasajero correspondiente?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Fidelización multipasajero","observations":"El segundo pasajero puede seguir teniendo su propio SUMA o programa SkyTeam.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.9","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-11","sourceRow":14,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras","component":"Beneficios SUMA","element":"Beneficio disponible antes de seleccionar","userState":"Logado","recordType":"Evidencia interna","insight":"Los extras incluidos por nivel SUMA no se anticipan ni explican antes de la selección","evidence":"Asiento, equipaje o embarque prioritario pueden estar incluidos por nivel, pero la pantalla no informa de ello ni explica que el beneficio debe seleccionarse para aplicarse.","uxImplication":"El usuario puede tener una ventaja disponible sin saber que existe, cómo activarla o a qué pasajero corresponde.","recommendation":"Identificar los extras incluidos por nivel, diferenciar tarifa vs SUMA e indicar necesidad de selección y pasajero beneficiado.","openQuestion":"¿Qué beneficios por nivel puede recuperar Amadeus y cuáles requieren selección explícita?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Beneficios SUMA en ancillaries","observations":"No asumir un patrón único para todos los extras; asiento, equipaje y otros servicios tienen reglas distintas.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.10","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-12","sourceRow":15,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras","component":"Resumen económico","element":"Millas, ahorro y total","userState":"Logado","recordType":"Evidencia interna","insight":"El resumen económico mezcla Millas, precio original, ahorro y total sin una jerarquía suficientemente clara","evidence":"El resumen lateral combina el precio original, el ahorro y una fórmula del tipo «8.800 Millas + 594,94 €» sin presentar de forma directa el resultado final.","uxImplication":"El usuario debe interpretar el cálculo para comprender cuánto utiliza, cuánto ahorra y cuánto paga.","recommendation":"Separar Millas utilizadas, precio original, ahorro, total a pagar y extras gratuitos por SUMA.","openQuestion":"¿Puede el resumen recuperar y presentar de forma fiable cada magnitud sin duplicar información con otros componentes?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Resultado económico y Millas","observations":"Este punto se relaciona con la auditoría específica del Slider de Millas.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.10","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-13","sourceRow":16,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras - Asientos","component":"Asientos","element":"Beneficio SUMA por pasajero","userState":"Logado","recordType":"Evidencia interna","insight":"El beneficio de asientos existe pero no se comunica ni se hace localizable para el pasajero SUMA","evidence":"La pantalla no identifica al pasajero como SUMA Silver ni qué asientos puede seleccionar sin coste; el beneficio se descubre al interactuar con el mapa.","uxImplication":"Un beneficio difícil de anticipar o localizar puede pasar desapercibido aunque esté disponible.","recommendation":"Identificar al pasajero, explicar que tiene asientos incluidos y diferenciar los asientos elegibles con etiqueta o leyenda además del color.","openQuestion":"¿Puede Amadeus identificar en el mapa qué asientos están incluidos según nivel y pasajero?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Beneficios SUMA en asientos","observations":"Caso específico de Asientos; no extrapolar automáticamente a otros ancillaries.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.11","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-14","sourceRow":17,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras - Equipaje","component":"Equipaje","element":"Origen de gratuidad","userState":"Logado","recordType":"Evidencia interna","insight":"La maleta gratuita se aplica correctamente pero no se explica que procede del nivel SUMA","evidence":"Para la pasajera SUMA el servicio aparece como «Gratis» y para el segundo pasajero con precio, pero no se explica el origen de la gratuidad ni su alcance por trayecto.","uxImplication":"El usuario puede utilizar el beneficio sin reconocer el valor que obtiene por su nivel o confundirlo con una inclusión de tarifa.","recommendation":"Diferenciar explícitamente «Incluido en la tarifa», «Incluido por tu nivel SUMA» y «Servicio adicional de pago».","openQuestion":"¿Cuántas maletas gratuitas corresponden por nivel y en qué pasajeros o trayectos se aplica el beneficio?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Beneficios SUMA en equipaje","observations":"Caso específico de Equipaje; la lógica puede depender de pasajero, trayecto y tarifa.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.12","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-15","sourceRow":18,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras","component":"Beneficios SUMA aplicados","element":"Servicios añadidos a 0 €","userState":"Logado","recordType":"Evidencia interna","insight":"Los servicios añadidos a 0 € no se atribuyen a SUMA una vez contratados","evidence":"Tras seleccionar asientos y maletas, la pantalla muestra los servicios con coste 0,00 € pero no explica que la gratuidad procede del nivel SUMA ni a qué pasajero o trayecto se aplica.","uxImplication":"La ventaja se recibe, pero su valor de fidelización queda invisible en la confirmación.","recommendation":"Etiquetar el origen del beneficio, indicar pasajero y trayecto y añadir un bloque de «Beneficios SUMA aplicados» cuando sea viable.","openQuestion":"¿Puede recuperarse el origen de cada gratuidad y reflejarse de forma consistente en tarjetas y resumen?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Proveniencia y comunicación de beneficios","observations":"Evitar indicadores genéricos cuando el usuario necesita saber quién recibe el beneficio.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.13","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-16","sourceRow":19,"product":"Booking","funnel":"Booking","minifunnel":"Booking transversal","screen":"Multipantalla","component":"Beneficios de fidelización","element":"Origen del beneficio","userState":"Logado","recordType":"Inferencia","insight":"El valor SUMA pierde visibilidad cuando la interfaz no explica de dónde procede cada ventaja","evidence":"A lo largo del flujo aparecen casos donde una ventaja existe o se aplica, pero no se diferencia si procede de la tarifa, del nivel SUMA o de una selección adicional.","uxImplication":"La procedencia del beneficio es información funcional: ayuda a comprender qué se ha obtenido, por qué y para quién.","recommendation":"Usar una lógica transversal de atribución que diferencie tarifa, nivel SUMA y servicio adicional, adaptada al contexto de cada pantalla.","openQuestion":"¿Qué modelo de datos permite conservar el origen del beneficio durante todo el booking?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Proveniencia y comunicación de beneficios","observations":"Inferencia transversal construida a partir de varios hallazgos de la auditoría; no equivale a un test de comprensión.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · pp.4–5, 10–13","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-17","sourceRow":20,"product":"Booking","funnel":"Booking","minifunnel":"Booking transversal","screen":"Multipantalla","component":"Continuidad SUMA","element":"Presencia contextual","userState":"Logado","recordType":"Inferencia","insight":"La experiencia SUMA necesita continuidad contextual durante el booking, no repetición idéntica","evidence":"La auditoría detecta valor o carencias de SUMA en Home, Fare Families, upsell, Summary, Paxes y Extras.","uxImplication":"La fidelización gana utilidad cuando cada pantalla comunica únicamente la información que afecta a la tarea y decisión de ese momento.","recommendation":"Definir una lógica de presencia SUMA por etapa del booking y evitar tanto la ausencia total como la sobrecarga repetitiva.","openQuestion":"¿En qué puntos debe estar visible SUMA y con qué intensidad para acompañar sin competir con la tarea principal?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Continuidad de fidelización","observations":"Conclusión transversal; debe contrastarse con research, comportamiento y restricciones técnicas.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · p.14","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-18","sourceRow":21,"product":"Booking","funnel":"Booking","minifunnel":"Booking transversal","screen":"Multipantalla","component":"Integración Amadeus","element":"Disponibilidad dinámica de beneficios","userState":"Logado","recordType":"Restricción","insight":"La viabilidad de varias mejoras depende de qué datos SUMA puede devolver Amadeus en cada punto del booking","evidence":"La auditoría deja pendientes de validación técnica la disponibilidad de acumulación y beneficios por Fare Family, datos dentro del upsell, elegibilidad por pasajero en extras y origen de gratuidades.","uxImplication":"La solución UX no puede consolidarse sin conocer qué información existe, cuándo está disponible y a qué pasajero, tarifa o segmento pertenece.","recommendation":"Mapear con Amadeus la disponibilidad de datos SUMA por pantalla antes de definir componentes finales o personalización dinámica.","openQuestion":"¿Qué datos están disponibles en cada pantalla y con qué granularidad de pasajero, segmento, tarifa y nivel?","origin":"Auditoría UX","channelEnvironment":"Desktop","market":"No especificado","impactUx":"Alto","uxLine":"Restricciones técnicas y datos","observations":"Restricción transversal. No implica que las oportunidades sean inviables, solo que su diseño depende de esta validación.","source":"auditoriaUX_FrequentFlyerBooking_jul26.pdf · pp.4–5, 10–11, 13–14","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"}],"history":[],"attachedAt":"2026-10-05T21:49:35.426Z","analysisVersion":null,"sheetName":"Insight Register","learningSuggestions":{"version":"2026-09-21.2","generatedAt":"2026-10-05T21:49:35.434Z","rowsFingerprint":"gqtkjv","candidates":[{"action":"Crear nuevo learning","theme":"service-effort","targetLearningId":"","newLearningTitle":"La identificación SUMA aporta valor cuando reduce esfuerzo y aprovecha información ya conocida","summary":"Los registros convergen en que la identificación aporta valor cuando se utiliza primero para simplificar la tarea: recuperar información conocida, evitar repeticiones y aplicar ventajas de forma comprensible antes de añadir más comunicación comercial.","impactUx":"Alto","rationale":"4 registros convergen en una línea diferenciada de reducción de esfuerzo y servicio.","evidence":["Auditoría UX: La Home reconoce correctamente al usuario SUMA una vez identificado","Auditoría UX: La comparación de Fare Families no utiliza el contexto SUMA del usuario identificado","Auditoría UX: La recuperación automática de datos personales y número SUMA reduce esfuerzo en Paxes","Auditoría UX: La viabilidad e perfil y reducción de esfuerzo","evidence":"Iberia, Vueling, Air France, Qatar y British Airways recuperan datos personales para usuarios identificados y, en varios casos, también el número de viajero frecuente.","uxImplication":"El valor del login no está solo en reconocer al usuario, sino en utilizar su perfil para reducir cumplimentación y evitar reintroducir datos.","recommendation":"Revisar qué datos del perfil SUMA pueden recuperarse automáticamente en Paxes y con qué reglas para multipasajero.","openQuestion":"¿Qué información del perfil SUMA puede recuperarse durante el booking sin introducir fricción o inconsistencias?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Alto","uxLine":"Personalización y reducción de fricción","observations":"El benchmark muestra implementación en competidores, no el impacto cuantitativo del autocompletado.","source":"benchmark_booking_frequentflyer_sep26.pdf · pp. 5, 9, 13, 16, 22, 25","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-8","sourceRow":12,"product":"Booking","funnel":"Booking","minifunnel":"Passengers/Paxes","screen":"Passengers/Paxes","component":"Pasajero frecuente","element":"Número de viajero frecuente por pasajero","userState":"Ambos","recordType":"Evidencia externa","insight":"La fidelización se gestiona a nivel de pasajero","evidence":"Iberia, Vueling, Air France y British Airways permiten asociar programas o números de viajero frecuente individualmente a cada pasajero. Qatar recupera automáticamente el número asociado al perfil seleccionado.","uxImplication":"En reservas multipasajero, la lógica de fidelización no puede tratarse únicamente a nivel de reserva.","recommendation":"Definir claramente qué pasajero recibe cada beneficio y contemplar reglas pasajero + segmento cuando corresponda.","openQuestion":"¿Cómo deben comunicarse los beneficios cuando una reserva incluye varios pasajeros con situaciones SUMA diferentes?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Alto","uxLine":"Fidelización multipasajero","observations":"La unidad de aplicación puede variar además por segmento, tarifa o servicio; no todos los beneficios son equivalentes.","source":"benchmark_booking_frequentflyer_sep26.pdf · pp. 5, 9, 13, 16, 22, 26","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-9","sourceRow":13,"product":"Booking","funnel":"Booking","minifunnel":"Summary","screen":"Summary / Shopping cart","component":"Millas / pago","element":"Mensaje adaptado al saldo","userState":"Logado","recordType":"Evidencia externa","insight":"El mensaje de Millas puede adaptarse a la situación real del usuario","evidence":"British Airways cambia el módulo tras el login: comunica si el usuario puede ahorrar con Avios y, cuando no hay saldo suficiente, lo explica de forma específica.","uxImplication":"Una vez identificado, la comunicación de Millas gana utilidad cuando refleja el saldo o posibilidad real de uso, en lugar de mantener un mensaje genérico.","recommendation":"Alinear la comunicación de Millas con saldo disponible, Millas utilizadas, ahorro y total a pagar cuando esa información sea técnicamente fiable.","openQuestion":"¿Qué información de saldo y uso de Millas puede mostrarse de forma consistente durante el booking?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Medio","uxLine":"Valor económico de Millas","observations":"Este patrón se observa claramente en British Airways y debe contrastarse con las reglas SUMA y la lógica actual del slider de Millas.","source":"benchmark_booking_frequentflyer_sep26.pdf · p. 21","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-10","sourceRow":14,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras - Asientos","component":"Asientos","element":"Nivel junto al pasajero","userState":"Logado","recordType":"Evidencia externa","insight":"Mostrar el estatus sin traducirlo en un beneficio visible aporta poco valor","evidence":"British Airways muestra el nivel del pasajero ('Socio del Club - Blue') en la selección de asientos, pero no explica si existen ventajas de selección asociadas ni las diferencia dentro del mapa.","uxImplication":"La mera presencia del estatus no ayuda a entender qué ventaja concreta aporta en ese contexto.","recommendation":"Si SUMA concede ventajas en asientos, comunicar el beneficio aplicado y su origen cerca del punto donde se percibe o selecciona.","openQuestion":"¿Qué beneficios SUMA de asiento existen por nivel y cómo deberían comunicarse en el mapa?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Medio","uxLine":"Beneficios SUMA en asientos","observations":"Caso específico de Asientos. No debe generalizarse automáticamente a otros extras.","source":"benchmark_booking_frequentflyer_sep26.pdf · p. 23","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-11","sourceRow":15,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras - Equipaje","component":"Equipaje","element":"Aviso de asociación de viajero frecuente","userState":"Ambos","recordType":"Evidencia externa","insight":"Los beneficios de equipaje pueden depender de que el viajero frecuente esté correctamente asociado","evidence":"British Airways informa de que para añadir datos de viajero frecuente y aplicar las ventajas correspondientes es necesario volver a la pantalla de datos del pasajero; aun estando logado, no queda claro qué beneficio de equipaje se está aplicando.","uxImplication":"Cuando una ventaja depende de la asociación del pasajero, el sistema debe hacer visible tanto la condición como el beneficio aplicado para evitar incertidumbre.","recommendation":"Revisar cómo comunica Air Europa los beneficios SUMA de equipaje y si el usuario entiende a qué pasajero y condición se aplican.","openQuestion":"¿Qué beneficios SUMA de equipaje dependen de pasajero, segmento, tarifa o nivel?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Medio","uxLine":"Beneficios SUMA en equipaje","observations":"Caso específico de Equipaje. No valida que el mismo patrón de comunicación funcione en Asientos u otros ancillaries.","source":"benchmark_booking_frequentflyer_sep26.pdf · p. 24","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-12","sourceRow":16,"product":"Booking","funnel":"Booking","minifunnel":"Extras/Ancillaries","screen":"Extras","component":"Ancillaries","element":"Mensaje de acumulación / recompensa","userState":"Ambos","recordType":"Inferencia","insight":"La fidelización aparece en servicios adicionales, pero no de forma homogénea","evidence":"Iberia comunica Avios en determinados extras, Air France XP en SAF, Qatar acumulación en algunos servicios y British Airways extiende beneficios a productos como vuelo + coche.","uxImplication":"Existe un patrón comercial de uso de la fidelización en ancillaries, pero los ejemplos corresponden a productos con reglas y motivaciones distintas.","recommendation":"No trasladar automáticamente una misma solución a Asientos, Equipaje u otros extras; analizar cada tipología según reglas, pasajero, segmento e inventario.","openQuestion":"¿Qué ancillaries se benefician realmente de incorporar información de fidelización y con qué patrón?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Medio","uxLine":"Fidelización en ancillaries","observations":"El benchmark no demuestra que mostrar recompensa incremente la contratación ni que todos los extras requieran el mismo tratamiento.","source":"benchmark_booking_frequentflyer_sep26.pdf · pp. 6, 10, 14, 18, 21, 26","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-13","sourceRow":17,"product":"Booking","funnel":"Booking","minifunnel":"Booking transversal","screen":"Multipantalla","component":"Continuidad de fidelización","element":"Presencia durante el funnel","userState":"Ambos","recordType":"Inferencia","insight":"La presencia de fidelización no es continua durante todo el booking","evidence":"En varias aerolíneas el login o la información de fidelización aparece en unas fases y desaparece en otras; Vueling y Qatar, por ejemplo, dejan de ofrecer login visible en Extras, y en otros casos el estatus permanece sin beneficio concreto.","uxImplication":"La continuidad del mensaje puede ser relevante para mantener comprensible el valor del programa, pero no implica que SUMA deba tener el mismo peso en todos los pasos.","recommendation":"Definir una lógica de presencia contextual de SUMA por momento del booking, evitando tanto desapariciones incoherentes como sobrecarga informativa.","openQuestion":"¿En qué momentos del booking debe SUMA ser visible y con qué intensidad?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Alto","uxLine":"Continuidad de fidelización","observations":"La consistencia no significa repetición idéntica: el contenido debe responder al contexto de cada paso.","source":"benchmark_booking_frequentflyer_sep26.pdf · pp. 10, 14, 18, 23–26","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"},{"id":"IR-14","sourceRow":18,"product":"Booking","funnel":"Booking","minifunnel":"Booking transversal","screen":"Multipantalla","component":"Beneficios de fidelización","element":"Origen del beneficio","userState":"Logado","recordType":"Inferencia","insight":"Los beneficios deben dejar claro de dónde proceden","evidence":"Air France identifica ventajas derivadas de Flying Blue. British Airways muestra el nivel en Asientos y referencias en Equipaje, pero no siempre explica qué beneficio concreto produce o si está aplicado.","uxImplication":"Mostrar una ventaja sin explicar si procede de la Fare Family, del nivel SUMA u otra condición reduce la capacidad de atribuir valor y puede generar dudas cuando algo aparece simplemente como 'gratis'.","recommendation":"Diferenciar visual y verbalmente beneficios derivados de Fare Family, nivel SUMA u otras condiciones aplicables.","openQuestion":"¿Comprenden los usuarios qué ventajas proceden de la tarifa y cuáles de su nivel SUMA?","origin":"Benchmark","channelEnvironment":"No especificado","market":"No especificado","impactUx":"Alto","uxLine":"Proveniencia y comunicación de beneficios","observations":"Air France funciona como referencia clara y British Airways como contrapunto. No valida una solución visual concreta para Air Europa.","source":"benchmark_booking_frequentflyer_sep26.pdf · pp. 11, 23–24, 26, 28","extraFields":{"Iniciativa":"SUMA Frequent Flyer"},"initiative":"SUMA Frequent Flyer"}],"history":[],"attachedAt":"2026-10-05T21:49:35.420Z","analysisVersion":null,"sheetName":"Insight Register","learningSuggestions":{"version":"2026-09-21.2","generatedAt":"2026-10-05T21:49:35.420Z","rowsFingerprint":"vbemkl","candidates":[{"action":"Reforzar learning existente","targetLearningId":"L-SUMA-01","newLearningTitle":"","summary":"3 registros aportan evidencia nueva al learning existente y refuerza su dirección actual.","impactUx":"Alto","rationale":"Coincidencia con L-SUMA-01 · 38% de afinidad media.","evidence":["Benchmark: El login puede recuperarse dentro del booking","Benchmark: El login gana valor cuando se vincula a un beneficio concreto","Benchmark: La fidelización aparece en servicios adicionales, pero no de forma homogénea"],"id":"LS-vlznb0","fingerprint":"vlznb0","rowRefs":[5,6,16],"status":"confirmed","createdAt":"2026-10-05T16:50:17.626Z","resolvedAt":"2026-10-05T16:51:49.331Z","appliedLearningId":"L-SUMA-01"},{"action":"Reforzar learning existente","targetLear on el Header. Entre quienes lo usan, el 70,34% utiliza el subheader y casi un 30% de quienes interactúan con el menú no termina redirigiéndose a ninguna parte.","uxImplication":"El valor del Header no debe medirse solo por volumen de clics. Cuando se utiliza, cumple una función de orientación y resolución sobre necesidades concretas.","recommendation":"Revisar encontrabilidad, naming y capacidad de resolución, especialmente en segundo nivel.","openQuestion":"¿Por qué una parte relevante de las interacciones con el menú no termina en redirección?","origin":"Análisis de datos / recogida de inputs","channelEnvironment":"No especificado","market":"España","uxLine":"Uso del Header · Capacidad de resolución","observations":"Dato interno del sistema actual. La falta de redirección no explica por sí sola la causa del comportamiento.","impactUx":"Alto","extraFields":{"Iniciativa":"Header"},"initiative":"Header"},{"id":"IR-2","sourceRow":5,"product":"Home","screen":"Home","component":"Header","element":"","recordType":"Hallazgo / evidencia interna","insight":"La gestión del viaje concentra gran parte del uso observado","evidence":"En España, Gestiona tu reserva representa el 51% del uso del Header. Información representa el 21%, Promociones el 18% y SUMA el 9%. El mapa de calor muestra además interacción relevante en Gestiona tu reserva y Haz Check-in en accesos rápidos de Home.","uxImplication":"Las tareas operativas tienen un peso claro en la navegación real y aparecen tanto dentro como fuera del menú.","recommendation":"Mantener alta visibilidad del autoservicio y ordenar mejor la convivencia entre menú principal y accesos directos.","openQuestion":"¿Qué journeys necesitan realmente acceso directo y cuáles pueden resolverse en segundo nivel?","origin":"Análisis de datos / recogida de inputs","channelEnvironment":"No especificado","market":"España","uxLine":"Autoservicio · Gestión del viaje","observations":"La duplicidad de accesos confirma relevancia de las tareas, pero no nsight":"El Header debe funcionar como sistema de orientación y acceso, no como contenedor de enlaces","evidence":"La revisión de bibliografía y benchmarks señala que la navegación superior debe ayudar al usuario a entender qué puede hacer, identificar su camino, acceder a tareas clave y mantener sensación de control.","uxImplication":"El valor del Header no está en acumular accesos, sino en reducir incertidumbre y orientar al usuario dentro del producto.","recommendation":"Diseñar la navegación desde tareas, contexto y claridad, evitando que la suma de necesidades internas determine por sí sola la estructura del primer nivel.","openQuestion":"¿Cómo debe reflejar el Header el contexto y la sección activa en los distintos entornos del ecosistema?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Orientación · Propósito del Header","observations":"Evidencia externa. La bibliografía incluye Baymard, Nielsen Norman Group, WCAG 2.2 e IATA. El documento agrupa las fuentes al final y no atribuye cada hallazgo a una referencia concreta.","impactUx":"Alto","extraFields":{"Iniciativa":"Header"},"initiative":"Header"},{"id":"IR-2","sourceRow":5,"product":"Home","screen":"Home","component":"Header","element":"","recordType":"Insight UX","insight":"La primera capa de navegación debe ser breve, clara y priorizada","evidence":"Los estudios revisados apuntan a mayor dificultad de lectura, comparación y decisión cuando demasiadas opciones compiten en el primer nivel. El informe plantea seleccionar accesos prioritarios y desplazar el resto a capas secundarias.","uxImplication":"La complejidad del ecosistema no necesita representarse completa en el primer impacto. La jerarquía y la selección condicionan la claridad percibida.","recommendation":"Reservar el primer nivel para los accesos de mayor valor y organizar el resto en niveles secundarios sin perder encontrabilidad.","openQuestion":"¿Qué accesos necesitan realmente permanecer en el primer nivel del Header de Air Europa?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Jerarquía · Primera capa","observations":"Evidencia externa. El análisis no determina el número exacto de categorías, accesos o niveles que debe utilizar Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Header"},"initiative":"Header"},{"id":"IR-3","sourceRow":6,"product":"Home","screen":"Home","component":"Header","element":"","recordType":"Insight UX","insight":"Navegación principal y utilidades deben diferenciarse","evidence":"La revisión distingue entre navegación principal y navegación de utilidades y señala que dar el mismo peso a necesidades diferentes aumenta la carga cognitiva y puede saturar el primer nivel.","uxImplication":"Las tareas principales, utilidades y accesos secundarios cumplen funciones distintas y necesitan una jerarquía visual y estructural coherente con su prioridad.","recommendation":"Separar visual y estructuralmente navegación principal, utilidades y contenidos secundarios.","openQuestion":"¿Qué elementos deberían considerarse navegación principal y cuáles utilidades?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Navegación principal · Utilidades","observations":"Criterio derivado de evidencia externa. Debe contrastarse con las prioridades reales y restricciones del ecosistema Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Header"},"initiative":"Header"},{"id":"IR-4","sourceRow":7,"product":"Home","screen":"Home","component":"Header","element":"","recordType":"Insight UX","insight":"El naming y el contexto forman parte de la orientación","evidence":"La revisión recomienda señalar claramente la sección activa, mantener jerarquía coherente entre niveles, usar labels que anticipen el contenido y evitar cambios de lógica entre áreas.","uxImplication":"Una arquitectura puede ser técnicamente correcta y seguir resultando ros bloques ocupan más proporción de pantalla y pueden retrasar el acceso al buscador. Fuente: 2.auditoriaUX.pdf, p.3 y p.9.","uxImplication":"La limitación de espacio convierte la priorización y el orden de aparición en parte central de la experiencia.","recommendation":"Diseñar una entrada mobile más enfocada y ligera, con lógica mobile-first y revisión clara de la búsqueda.","openQuestion":"¿Qué secuencia reduce esfuerzo sin perder contexto ni capacidad de edición?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Flujo y secuenciación; Fricción y eficiencia","observations":"No demuestra que un flujo por pasos concreto sea superior. Requiere validación.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-4","sourceRow":7,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Inferencia","insight":"La recuperación de la última búsqueda es una funcionalidad que conviene conservar","evidence":"La auditoría la identifica como positiva porque reduce esfuerzo y permite retomar el proceso sin empezar desde cero. Fuente: 2.auditoriaUX.pdf, p.3.","uxImplication":"La continuidad puede ser especialmente útil para usuarios que comparan o retoman una consulta.","recommendation":"Mantener la última búsqueda con datos claramente precargados, editables y fáciles de limpiar.","openQuestion":"¿Cuánto se utiliza y cuántos usuarios editan los datos antes de volver a buscar?","origin":"Auditoría UX","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Personalización; Control y autonomía","observations":"No existe en esta auditoría una medición aislada de uso, éxito o impacto en conversión.","impactUx":"Medio","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-5","sourceRow":8,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Above the fold","element":"","recordType":"Inferencia","insight":"El primer impacto necesita una jerarquía explícita entre conversión, autoservicio y contenido comercial","evidence":"Header, claim, buscador, banner y accesos rápidos comparten protagonismo. La auditoría propone priorizar búsqueda de vuelos, después autoservicio, campañas y navegación global. Fuente: 2.auditoriaUX.pdf, p.4.","uxImplication":"La Home resuelve necesidades distintas, pero no todas deben recibir el mismo peso visual.","recommendation":"Hacer que el buscador gobierne la jerarquía manteniendo accesibles las tareas operativas frecuentes.","openQuestion":"¿Qué composición conserva el valor de autoservicio y campañas sin debilitar la búsqueda?","origin":"Auditoría UX","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Jerarquía visual; Arquitectura de información","observations":"Es una recomendación de jerarquía, no una solución visual validada.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-6","sourceRow":9,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Header","element":"","recordType":"Inferencia","insight":"El autoservicio forma parte del valor de la Home y no debe desaparecer al reforzar el buscador","evidence":"Check-in, Gestiona tu reserva e Información de vuelos responden a usuarios que llegan a resolver tareas concretas, no solo a comprar. Fuente: 2.auditoriaUX.pdf, p.5 y p.8.","uxImplication":"La oportunidad está en ordenar el peso y la ubicación de estos accesos, no en eliminarlos.","recommendation":"Mantenerlos visibles con jerarquía secundaria y decidir su papel respecto al Header y los accesos rápidos.","openQuestion":"¿Qué accesos necesitan presencia directa en Home y cuáles pueden depender del Header?","origin":"Auditoría UX","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Encontrabilidad; Arquitectura de información","observations":"La auditoría remite a datos de uso previos, pero no demuestra aquí icación maximizan valor comercial sin interferir con el buscador?","origin":"Auditoría UX","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Jerarquía visual","observations":"La auditoría no aporta una comparación causal entre formatos o posiciones del banner.","impactUx":"Medio","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-9","sourceRow":12,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Accesos rápidos","element":"","recordType":"Inferencia","insight":"En mobile los accesos rápidos son útiles, pero pueden necesitar un tratamiento más compacto","evidence":"Las cards de Check-in, Gestiona tu reserva e Información de vuelos evitan depender del menú, aunque consumen altura en un contexto ya denso. Fuente: 2.auditoriaUX.pdf, p.8-p.9.","uxImplication":"El valor funcional puede conservarse con menor peso visual si la encontrabilidad no se degrada.","recommendation":"Probar un patrón más ligero manteniendo visibilidad y targets táctiles adecuados.","openQuestion":"¿Qué formato mantiene el uso de autoservicio reduciendo scroll y saturación?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Encontrabilidad; Fricción y eficiencia","observations":"La auditoría no valida qué patrón compacto funcionará mejor.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-10","sourceRow":13,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Inferencia","insight":"El rediseño debe consolidar el buscador como componente de sistema, no como una solución puntual","evidence":"La auditoría concluye que el componente debe documentar estructura, variantes, estados, responsive y accesibilidad. Fuente: 2.auditoriaUX.pdf, p.10-p.11.","uxImplication":"Convertir la solución en patrón reutilizable reduce deuda visual y facilita consistencia entre dispositivos y evoluciones futuras UX.pdf, p.8-p.9.","uxImplication":"El valor funcional puede conservarse con menor peso visual si la encontrabilidad no se degrada.","recommendation":"Probar un patrón más ligero manteniendo visibilidad y targets táctiles adecuados.","openQuestion":"¿Qué formato mantiene el uso de autoservicio reduciendo scroll y saturación?","origin":"Auditoría UX","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Autoservicio mobile","observations":"La auditoría no valida qué patrón compacto funcionará mejor.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-10","sourceRow":13,"product":"Home","screen":"Home","component":"Buscador","element":"UI Kit y estados","recordType":"Insight UX","insight":"El rediseño debe consolidar el buscador como componente de sistema, no como una solución puntual","evidence":"La auditoría concluye que el componente debe documentar estructura, variantes, estados, responsive y accesibilidad. Fuente: 2.auditoriaUX.pdf, p.10-p.11.","uxImplication":"Convertir la solución en patrón reutilizable reduce deuda visual y facilita consistencia entre dispositivos y evoluciones futuras.","recommendation":"Definir el componente en el UI Kit con estados, reglas responsive, accesibilidad y comportamiento de opciones secundarias.","openQuestion":"¿Qué restricciones de Amadeus/PSS y Magnolia deben formar parte de las variantes del componente?","origin":"Auditoría UX","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Design System y escalabilidad","observations":"La auditoría recomienda esta evolución, pero no confirma implementación ni viabilidad técnica final.","impactUx":"Medio","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"}],"recognizedFields":["product","screen","component","element","recordType","insight","evidence","uxImplication","recommendation","openQuestion","origin","channelEnvironment","market","uxLine","observations","impactUx"]}],"attachedAt":"2026-10-05 fficedocument.spreadsheetml.sheet","lastModified":1789975378024},"simpleKnowledgeActive":true,"supportingDocument":false,"documentProfile":{"title":"Desk Research","analysisType":"Insight Register","date":"No especificada","initiative":"Buscador","primaryProduct":"Home","scope":"","outOfScope":"","devices":[],"markets":[],"segments":[],"evidenceSources":[],"generalRestrictions":[],"documentLimits":[],"reviewedByUx":true,"associatedFiles":{"source":{"name":"BUSCADOR_03_Desk_Research.xlsx","available":true,"role":"source"},"insightRegister":{"name":"BUSCADOR_03_Desk_Research.xlsx","size":13429,"type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","lastModified":1789975378024,"role":"insight-register"}}},"insightRegister":{"version":"insight-register-2","status":"attached-primary-source","reviewedByUx":true,"file":{"name":"BUSCADOR_03_Desk_Research.xlsx","size":13429,"type":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","lastModified":1789975378024,"role":"insight-register"},"headers":["Producto","Funnel","Minifunnel","Pantalla","Componente","Elemento","Tipo","Insight / hallazgo","Evidencia","Lectura UX","Recomendación / oportunidad","Pregunta abierta","Origen","Dispositivo","Mercado","Línea UX / agrupación","Observaciones","Iniciativa","Impacto UX"],"recognizedFields":["product","funnel","minifunnel","screen","component","element","recordType","insight","evidence","uxImplication","recommendation","openQuestion","origin","channelEnvironment","market","uxLine","observations","impactUx"],"rows":[{"id":"IR-1","sourceRow":4,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"El buscador debe evaluarse como la entrada al funnel completo, no como un módulo aislado","evidence":"La literatura revisada sitúa la búsqueda inicial como primer punto de decisión y recomienda priorizar la acción principal, mantener visibles los datos esenciales y facilitar edición posterior. Fuente: 3.deskresearch.pdf, p.3.","uxImplication":"La calidad del buscador condiciona comprensión, continuidad y capacidad de corregir la búsqueda en pasos posteriores.","recommendation":"Diseñar el componente considerando su relación con Disponibilidad, tarifas y edición posterior de la búsqueda.","openQuestion":"¿Qué información necesita permanecer visible o editable después de lanzar la búsqueda?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Flujo y secuenciación","observations":"Evidencia externa. No valida directamente una solución en Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-2","sourceRow":5,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Simplificar significa ordenar decisiones por momento, no eliminar funcionalidad","evidence":"Se recomienda mostrar primero lo imprescindible, agrupar campos relacionados, evitar etiquetas ambiguas y reducir competencia visual con el CTA. Fuente: 3.deskresearch.pdf, p.4.","uxImplication":"Las decisiones secundarias introducidas demasiado pronto pueden aumentar carga cognitiva antes de que exista una búsqueda básica.","recommendation":"Aplicar progressive disclosure a opciones avanzadas manteniendo visibles los criterios esenciales.","openQuestion":"¿Qué opciones son imprescindibles para iniciar correctamente una búsqueda en Air Europa?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Arquitectura de información; Fricción y eficiencia","observations":"El desk research aporta principios generales. La priorización concreta necesita datos internos y restricciones de negocio.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-3","sourceRow":6,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Mobile necesita una interacción propia y no una versión comprimida de desktop","evidence":"Se recomiendan targets táctiles amplios, CTAs visibles, calendarios adaptados, menos densidad y edición sin pérdida de contexto. Fuente: 3.deskresearch.pdf, p.5.","uxImplication":"Postura, atención, precisión táctil y tolerancia al esfuerzo cambian en mobile y afectan la construcción de la búsqueda.","recommendation":"Diseñar mobile como escenario principal con secuencia clara, feedback y edición rápida.","openQuestion":"¿Qué patrón de interacción permite completar y revisar la búsqueda con menos esfuerzo en mobile?","origin":"Desk research","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Flujo y secuenciación; Fricción y eficiencia","observations":"La investigación citada es externa y no demuestra qué patrón concreto funcionará mejor en Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-4","sourceRow":7,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Calendario","element":"","recordType":"Evidencia externa","insight":"El calendario puede ser una herramienta de decisión, no solo un selector operativo","evidence":"El desk research recomienda comparar días, mostrar precios cercanos cuando sea posible y permitir modificar fechas sin reiniciar el proceso. Fuente: 3.deskresearch.pdf, p.6.","uxImplication":"Ayudar a explorar alternativas puede reducir incertidumbre en usuarios sensibles a precio o con flexibilidad.","recommendation":"Evaluar flexibilidad, comparación y edición de fechas como oportunidades, sujetas a viabilidad técnica.","openQuestion":"¿Qué nivel de información de precio o flexibilidad puede ofrecerse antes de Disponibilidad?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Control y autonomía","observations":"No demuestra impacto en conversión para Air Europa ni confirma disponibilidad de datos/precios en el buscador.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-5","sourceRow":8,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"El buscador inicial no necesita resolver todas las decisiones del viaje","evidence":"Horarios, escalas, aeropuertos, duración, equipaje, tarifas o condiciones pueden tener más sentido cuando ya existen resultados para comparar. Fuente: 3.deskresearch.pdf, p.7.","uxImplication":"Cargar decisiones de refinamiento en el primer impacto puede añadir complejidad antes de tiempo.","recommendation":"Mantener en Home solo las opciones necesarias para construir correctamente la búsqueda y desplazar refinamientos cuando el contexto lo permita.","openQuestion":"¿Qué opciones afectan a la validez de la búsqueda y cuáles son refinamiento posterior?","origin":"Desk research","channelEnvironment":"Desktop + mobile","market":"No especificado","uxLine":"Arquitectura de información; Fricción y eficiencia","observations":"El principio es general y no define automáticamente qué campo concreto debe moverse fuera del buscador.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-6","sourceRow":9,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Above the fold","element":"","recordType":"Evidencia externa","insight":"El rendimiento forma parte de la experiencia del primer impacto","evidence":"El documento relaciona velocidad, estabilidad visual y feedback con percepción de calidad, especialmente en mobile, y recomienda priorizar carga de elementos críticos. Fuente: 3.deskresearch.pdf, p.8.","uxImplication":"Un hero o componente visualmente atractivo puede degradar la experiencia si retrasa la interacción o provoca saltos.","recommendation":"Evaluar cualquier evolución del above the fold también por onfirmar fácilmente qué ha seleccionado y qué puede modificar. Fuente: 5.analisis conductual.pdf, p.3.","uxImplication":"Con menos contexto visible, labels, valores seleccionados y affordances de edición ganan importancia.","recommendation":"Usar labels claros, valores persistentes y edición sencilla sin pérdida de contexto.","openQuestion":"¿Qué campos generan más dudas sobre estado, selección o editabilidad en mobile?","origin":"Análisis conductual","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Reducción de incertidumbre","observations":"Interpretación apoyada en datos previos, no una medición específica de incertidumbre.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-6","sourceRow":9,"product":"Home","screen":"Home","component":"Buscador","element":"Resumen de búsqueda","recordType":"Insight UX","insight":"Reconocimiento antes que recuerdo favorece mantener visibles los datos configurados","evidence":"El principio se aplica a campos completados y resumen de búsqueda, especialmente en mobile donde hay menos contexto visible. Fuente: 5.analisis conductual.pdf, p.4-p.5.","uxImplication":"El usuario no debería depender de recordar ruta, fechas, pasajeros o tipo de viaje entre pasos.","recommendation":"Mantener un resumen claro y editable cuando la interacción sea secuencial.","openQuestion":"¿Puede resolverse la revisión sin añadir un paso extra al flujo?","origin":"Análisis conductual","channelEnvironment":"Mobile","market":"No especificado","uxLine":"Reconocimiento y memoria","observations":"Es un principio de diseño. No demuestra qué formato de resumen es óptimo.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-7","sourceRow":10,"product":"Home","screen":"Home","component":"Buscador","element":"Opciones secundarias","recordType":"Insight UX","insight":"Progressive disclosure permite conservar funcionalidad sin mostrar todo con el mismo peso","evidence": e","Elemento","Tipo","Insight / hallazgo","Evidencia","Lectura UX","Recomendación / oportunidad","Pregunta abierta","Origen","Dispositivo","Mercado","Línea UX / agrupación","Observaciones","Iniciativa","Impacto UX"],"recognizedFields":["product","funnel","minifunnel","screen","component","element","recordType","insight","evidence","uxImplication","recommendation","openQuestion","origin","channelEnvironment","market","uxLine","observations","impactUx"],"rows":[{"id":"IR-1","sourceRow":4,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Desktop suele presentar el buscador como pieza principal del above the fold y permite una lectura global del formulario","evidence":"La mayoría de referentes sitúan el buscador por encima del contenido promocional o integrado en el hero, mostrando más campos desde el inicio. Fuente: 6.benchmark.pdf, p.69-p.70.","uxImplication":"Desktop puede aprovechar el espacio para mostrar contexto completo siempre que las opciones secundarias no diluyan la tarea.","recommendation":"Mantener ruta, fechas, pasajeros y CTA legibles en una vista global y controlar el peso de la capa comercial.","openQuestion":"¿Qué nivel de información simultánea maximiza claridad sin volver a generar densidad?","origin":"Benchmark","channelEnvironment":"Desktop","market":"Internacional","uxLine":"Jerarquía visual","observations":"Evidencia externa. La frecuencia de un patrón no demuestra que sea óptimo para Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-2","sourceRow":5,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Mobile necesita una entrada más reducida o secuencial que desktop","evidence":"En varios referentes no se muestran todos los campos desde el inicio; la experiencia prioriza ruta y despliega fechas, pasajeros y opciones después. Fuente: 6.benchmark.pdf, p.69-p.72 y p.85.","uxImplication":"Reducir carga inicial puede facilitar la entrada a la tarea, pero la búsqueda completa debe seguir siendo comprensible.","recommendation":"Explorar una construcción progresiva del buscador mobile manteniendo revisión y edición antes de resultados.","openQuestion":"¿Qué campos deben aparecer en el primer impacto y cuáles después?","origin":"Benchmark","channelEnvironment":"Mobile","market":"Internacional","uxLine":"Flujo y secuenciación; Fricción y eficiencia","observations":"Patrón externo. No demuestra que un flujo por pasos convierta mejor en Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-3","sourceRow":6,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Simplificar mobile no debe impedir revisar la búsqueda completa antes de avanzar","evidence":"El benchmark identifica como riesgo que el usuario llegue a resultados sin poder revisar claramente todos los criterios configurados. Fuente: 6.benchmark.pdf, p.70-p.72 y p.81.","uxImplication":"La reducción inicial de campos necesita un cierre que preserve control y evite búsquedas con datos no revisados.","recommendation":"Incluir un estado o resumen editable antes de lanzar resultados cuando el flujo sea secuencial.","openQuestion":"¿Puede resolverse la revisión en el propio buscador sin añadir una pantalla adicional?","origin":"Benchmark","channelEnvironment":"Mobile","market":"Internacional","uxLine":"Control y autonomía; Claridad y comprensión","observations":"No demuestra que una pantalla de revisión independiente sea necesaria.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-4","sourceRow":7,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"El avance guiado cobra más valor en mobile porque reduce pasos manuales","evidence":"Los modelos guiados abren automáticamente el siguiente campo; el modelo manual aporta control pero exige más atención y puede hacerse pesado con scroll. Fuente: 6.benchmark.pdf, p.71 y p.85.","uxImplication":"Guiar el orden puede reducir esfuerzo táctil si el usuario conserva capacidad de revisar y editar.","recommendation":"Validar una interacción guiada o semiguiada en mobile.","openQuestion":"¿Qué nivel de automatización mejora fluidez sin generar sensación de pérdida de control?","origin":"Benchmark","channelEnvironment":"Mobile","market":"Internacional","uxLine":"Flujo y secuenciación; Fricción y eficiencia","observations":"La existencia del patrón no demuestra superioridad universal ni aplica igual a desktop.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-5","sourceRow":8,"product":"Home","funnel":"","minifunnel":"","screen":"Home","component":"Buscador","element":"","recordType":"Evidencia externa","insight":"Origen y destino condicionan la percepción inicial y pueden facilitar exploración además de precisión","evidence":"Algunas aerolíneas muestran aeropuertos, sugerencias o destinos populares sin escritura previa; otras exigen caracteres para ganar precisión. Fuente: 6.benchmark.pdf, p.73 y p.85.","uxImplication":"En mobile depender del teclado desde el primer paso puede añadir esfuerzo, especialmente si la ruta no está cerrada.","recommendation":"Evaluar sugerencias, recientes o listados accesibles manteniendo ciudad, aeropuerto y código claros.","openQuestion":"¿Qué combinación de exploración y búsqueda por texto funciona mejor para usuarios de Air Europa?","origin":"Benchmark","channelEnvironment":"Desktop + mobile","market":"Internacional","uxLine":"Encontrabilidad","observations":"Existe un trade-off entre exploración y precisión; el benchmark no resuelve qué modelo es mejor para Air Europa.","impactUx":"Alto","extraFields":{"Iniciativa":"Bus Ux":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-4","sourceRow":7,"product":"Home","screen":"Home","component":"Buscador","element":"Paso Home → Disponibilidad","recordType":"Insight UX","insight":"Mobile genera más búsquedas pero presenta mayor abandono entre búsqueda y resultados","evidence":"Mobile: 528.301 búsquedas desde Home, 466.663 llegadas a Disponibilidad y 11,67% de abandono. Fuente: 7.analisis de datos.pdf, p.4.","uxImplication":"Existe una pérdida mayor en mobile que merece diagnóstico específico entre el lanzamiento de búsqueda y la llegada a resultados.","recommendation":"Investigar por dispositivo la transición Home → Disponibilidad antes de atribuirla al diseño del buscador.","openQuestion":"¿El abandono ocurre por validación, carga, errores, navegación o interrupciones de sesión?","origin":"Quantum Metric / Data","channelEnvironment":"Mobile","market":"ES/ES","uxLine":"Avance y abandono","observations":"QM indica que algunas sesiones se interrumpen tras buscar y no siempre puede determinar lo que ocurre después. La diferencia no prueba causalidad.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-5","sourceRow":8,"product":"Home","screen":"Home","component":"Buscador","element":"Paso Home → Disponibilidad","recordType":"Insight UX","insight":"Desktop presenta una transición más eficiente hacia Disponibilidad en el periodo analizado","evidence":"Desktop: 360.320 búsquedas desde Home, 334.302 llegadas a Disponibilidad y 7,22% de abandono. Fuente: 7.analisis de datos.pdf, p.4.","uxImplication":"La comparación refuerza que mobile necesita análisis propio y no debe asumirse un comportamiento equivalente.","recommendation":"Mantener medición separada por dispositivo y comparar causas de abandono, no solo tasas agregadas.","openQuestion":"¿Qué diferencias de interacción o rendimiento explican la brecha frente a mobile?","origin":"Quantum Metric / Data","channelEnvironment":"Desktop","market":"ES/ES","uxLine":"Avance por dispositivo","observations":"Periodo concreto. No debe generalizarse a otros mercados, campañas o momentos sin nueva medición.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-6","sourceRow":9,"product":"Home","screen":"Home","component":"Header","element":"Autogestión","recordType":"Insight UX","insight":"La Home tiene una segunda intención relevante: resolver tareas operativas","evidence":"Desktop: Gestiona tu reserva 111,89K, Mi cuenta 36,94K y Check-in 23,54K en navegación; los accesos rápidos también reciben uso. Fuente: 7.analisis de datos.pdf, p.5.","uxImplication":"Reforzar la búsqueda no justifica eliminar accesos que responden a necesidades reales de usuarios con viajes existentes.","recommendation":"Mantener autogestión visible con jerarquía complementaria al buscador.","openQuestion":"¿Qué accesos generan éxito de tarea posterior y reducen esfuerzo o contacto?","origin":"Quantum Metric / Data","channelEnvironment":"Desktop","market":"ES/ES","uxLine":"Autoservicio desktop","observations":"Los clics no informan sobre éxito de tarea, CES o reducción de llamadas.","impactUx":"Alto","extraFields":{"Iniciativa":"Buscador"},"initiative":"Buscador"},{"id":"IR-7","sourceRow":10,"product":"Home","screen":"Home","component":"Accesos rápidos","element":"Autogestión","recordType":"Insight UX","insight":"Los shortcuts de autogestión mantienen uso en mobile aunque su peso relativo sea menor que el buscador","evidence":"Mobile: Check-in 28,46K, Gestiona tu reserva 26,2K e Información de vuelos 12,96K. Fuente: 7.analisis de datos.pdf, p.5.","uxImplication":"Su menor peso relativo no implica menor importancia funcional y puede estar condicionado por uso de la app.","recommendation":"Mantener accesos rápidos visibles, con tratamiento ligero y secundario.","openQuestion":"¿Cuánto cambia la distribución si se combina web mobile con uso de la app?","origin":"Quantum Metric / Data","chan

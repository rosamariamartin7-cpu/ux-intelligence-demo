mpacto en conversión de esta funcionalidad."],"noProof":["No demuestra que deba activarse igual para todos los usuarios, dispositivos o contextos."],"open":["¿Cuántos usuarios recuperan una búsqueda y cuánto editan antes de continuar?","¿Qué reglas de persistencia y privacidad necesita el patrón?"],"applications":["Última búsqueda","Continuidad","Edición","Personalización","Home","Buscador","Control y autonomía"],"sourceNames":["BUSCADOR_02_Auditoria_UX","BUSCADOR_03_Desk_Research","BUSCADOR_06_Benchmark","Auditoría heurística","Desk Research","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-13","publicationHistory":[{"documentId":"IR-1789810024734","sourceName":"Desk Research","decision":"Reforzar learning existente","publishedAt":"2026-09-21T07:23:28.107Z","rowRefs":[12]},{"documentId":"IR-1789810176105","sourceName":"Benchmark","decision":"Reforzar learning existente","publishedAt":"2026-09-21T10:27:07.001Z","rowRefs":[13]},{"documentId":"IR-1789809889133","sourceName":"Auditoría heurística","decision":"Reforzar learning existente","publishedAt":"2026-10-13T11:40:09.979Z","rowRefs":[7]}]},{"id":"L-BUS-08","initiative":"Buscador","initiatives":["Buscador"],"area":"Buscador","impactUx":"Medio","validity":"Vigente","product":"Home","screen":"Home","component":"Banner promocional","element":"","device":"Desktop + mobile","market":"No especificado","title":"Promoción, avisos y ayuda necesitan una jerarquía contextual para convivir con la búsqueda","text":"Las capas promocionales y de apoyo pueden aportar valor, pero su prioridad debe depender del contexto y no competir de forma permanente con la tarea principal.","know":"Los registros revisados muestran que banners, avisos y ayudas tienen funciones distintas. La promoción genera interacción y avance posterior; avisos y ayuda pueden ganar prioridad cuando el contexto lo exige. 1 registro aporta evidencia nueva al learning existente y amplía su contexto o aplicaciones.","forEvidence":["Auditoría UX: identifica el peso del banner y la necesidad de mantener ayuda y avisos sin desplazar la búsqueda.","Análisis heurístico/QM: señala competencia entre promoción, avisos y tarea principal.","Benchmark: trata promoción y soporte como capas secundarias o contextuales.","Datos QM: los banners generan interacción y avance posterior hacia búsqueda, Disponibilidad y reserva en el periodo analizado.","Quantum Metric; Data: En mobile los banners generan interacción y avance posterior hacia búsqueda y reserva","Quantum Metric; Data: Desktop también registra valor del banner, aunque con menor conversión final que mobile en el periodo","Auditoría UX: El formato separado de imagen y texto es adecuado, pero el peso del banner debe controlarse","Quantum Metric; Heurística: El banner aporta interacción, pero no debería convertirse en una segunda acción dominante","Benchmark: Avisos y ayuda deben funcionar como capas de soporte y ser especialmente selectivos en mobile"],"contrary":["El rendimiento y peso relativo de promoción varían por dispositivo y periodo."],"noProof":["No demuestra que el formato o posición actuales sean óptimos.","No permite equiparar una campaña comercial, un aviso operativo y una ayuda contextual."],"open":["¿Qué reglas de prioridad, caducidad y peso visual necesita cada tipología?","¿Cómo medir su interferencia o contribución respecto a la búsqueda principal?"],"applications":["Banner promocional","Avisos","Ayuda contextual","Sistema de prioridades de Home","Home","Jerarquía visual","Buscador","Orientación y ayuda","Feedback y estado"],"sourceNames":["BUSCADOR_02_Auditoria_UX","BUSCADOR_04_Analisis_Heuristico_QM","BUSCADOR_06_Benchmark","BUSCADOR_07_Datos_QM","Análisis y recogida de inputs","Auditoría heurística","Analisis Heurístico","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-13","publicationHistory":[{"documentId":"IR-1789810207336","sourceName":"Análisis y recogida de inputs","decision":"Reforzar learning existente","publishedAt":"2026-09-21T06:26:05.159Z","rowRefs":[11,12]},{"documentId":"IR-1789810080587","sourceName":"Analisis Heurístico","decision":"Ampliar learning","publishedAt":"2026-09-21T09:57:04.160Z","rowRefs":[12]},{"documentId":"IR-1789810176105","sourceName":"Benchmark","decision":"Reforzar learning existente","publishedAt":"2026-09-21T10:36:02.279Z","rowRefs":[15]},{"documentId":"IR-1789809889133","sourceName":"Auditoría heurística","decision":"Reforzar learning existente","publishedAt":"2026-10-13T11:40:09.979Z","rowRefs":[11]}]},{"id":"L-HEAD-01","initiative":"Header","initiatives":["Header"],"area":"Header","impactUx":"Alto","product":"Home","screen":"Home","component":"Header","element":"","device":"Desktop + mobile","market":"No especificado","title":"El lenguaje de navegación debe anticipar la tarea y el contenido que el usuario encontrará","text":"Los labels y agrupaciones del Header deben ayudar a anticipar qué puede hacer el usuario y qué encontrará después, evitando categorías ambiguas que obliguen a explorar o usar Ayuda como rescate.","know":"Los registros revisados de Header convergen en que el naming orientado a tareas mejora la comprensión de la navegación. Gestionar reserva y Check-in se entienden como tareas claras, mientras que «Antes de volar» no anticipa bien contenidos críticos y Ayuda también se utiliza como vía de rescate cuando la arquitectura no orienta.","forEvidence":["Test con usuarios: «Gestionar reserva» funciona como etiqueta comprensible, Check-in necesita acceso propio y «Antes de volar» no orienta bien hacia contenidos críticos.","Test con usuarios: Ayuda funciona también como vía de rescate cuando el usuario no identifica dónde resolver su necesidad.","Benchmark y desk research: la navegación debe alinearse con la intención del usuario y utilizar una primera capa clara y orientada a tareas.","Auditoría heurística: el naming actual no siempre permite anticipar correctamente el contenido."],"contrary":["Algunas etiquetas actuales sí se comprenden y una vía de rescate como Ayuda sigue siendo necesaria aunque mejore la arquitectura."],"noProof":["No valida un wording concreto para todos los mercados o idiomas.","No demuestra que cambiar únicamente el naming mejore conversión o éxito de tarea si la agrupación y la jerarquía siguen siendo confusas."],"open":["¿Qué labels funcionan mejor por mercado e idioma sin perder consistencia global?","¿Qué necesidades están llegando a Ayuda porque la navegación principal no las hace encontrables?"],"applications":["Header","Naming de navegación","Arquitectura de información","Ayuda","Accesibilidad cognitiva"],"sourceNames":["Test con usuarios","Benchmark","Desk research","Auditoría heurística"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-09-19"},{"id":"L-HEAD-02","initiative":"Header","initiatives":["Header"],"area":"Header","impactUx":"Alto","product":"Home","screen":"Home","component":"Header","element":"","device":"Desktop + mobile","market":"No especificado","title":"La complejidad del Header depende más de cómo se organiza que del número de opciones","text":"La arquitectura debe resolver la complejidad mediante jerarquía, agrupación y separación entre navegación principal, tareas operativas y utilidades, no mediante una reducción indiscriminada de enlaces.","know":"Los registros revisados muestran que la simplicidad visible del Header puede ocultar una arquitectura compleja. Los problemas aparecen cuando se mezclan categorías, tareas y utilidades o cuando demasiadas opciones comparten el mismo nivel de prioridad.","forEvidence":["Auditoría heurística: la simplicidad visible oculta una arquitectura más compleja y la agrupación mezcla categorías, tareas y utilidades.","Desk research: la primera capa debe ser breve, clara y priorizada, diferenciando navegación principal y utilidades.","Benchmark: la complejidad se gestiona mejor con jerarquía, modularidad y aparición progresiva que acumulando opciones equivalentes.","Test con usuarios: las necesidades operativas del pasajero deben ganar prioridad frente a una organización puramente temática."],"contrary":["Negocio, SEO, SUMA, ofertas y otras necesidades estratégicas pueden exigir presencia en la arquitectura aunque no sean la prioridad UX principal."],"noProof":["No determina un número óptimo universal de opciones de primer nivel.","No valida eliminar enlaces o funcionalidades por el mero hecho de reducir volumen."],"open":["¿Qué tareas deben permanecer en primer nivel y cuáles pueden pasar a una segunda capa por dispositivo?","¿Cómo integrar necesidades de negocio y SEO sin degradar la jerarquía de tareas del usuario?"],"applications":["Header","Arquitectura de información","Jerarquía","Navegación principal vs utilidades","Progressive disclosure"],"sourceNames":["Auditoría heurística","Desk research","Benchmark","Test con usuarios"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-09-19"},{"id":"L-HEAD-03","initiative":"Header","initiatives":["Header"],"area":"Header","impactUx":"Medio","product":"Home","screen":"Home","component":"Header","element":"","device":"Desktop + mobile","market":"No especificado","title":"La misma arquitectura de Header no responde igual en todos los contextos","text":"El comportamiento del Header cambia según dispositivo, mercado y contexto de uso, por lo que una arquitectura común necesita comprobarse antes de tratarse como una solución universal.","know":"Los registros revisados detectan diferencias de comportamiento entre mercados y muestran que una misma arquitectura no responde igual en todos los contextos. Mobile además amplifica fricciones presentes en desktop, por lo que la adaptación no puede limitarse al tamaño de pantalla.","forEvidence":["Análisis y recogida de inputs: el comportamiento del Header cambia entre mercados.","Auditoría heurística: una misma arquitectura no responde igual de bien a todos los contextos y mobile amplifica fricciones ya presentes en desktop.","Los resultados de experimentación incluidos en la iniciativa muestran comportamientos diferentes entre desktop y mobile."],"contrary":["La documentación disponible no cuantifica todavía qué diferencias justifican una arquitectura distinta por mercado o contexto."],"noProof":["No demuestra que cada mercado necesite un Header diferente.","No permite definir todavía reglas de segmentación por mercado, página o perfil de usuario."],"open":["¿Qué diferencias por mercado son suficientemente relevantes como para cambiar priorización o arquitectura?","¿Qué partes del Header deben mantenerse globales y cuáles pueden adaptarse por contexto?"],"applications":["Header","Responsive","Mercados","Contextualización","Gobernanza de navegación"],"sourceNames":["Análisis y recogida de inputs","Auditoría heurística","Resultados test A/B mobile","Resultados test A/B desktop"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-09-19"},{"id":"L-SUMA-01","initiative":"SUMA Frequent Flyer","initiatives":["SUMA Frequent Flyer"],"area":"SUMA / Frequent Flyer","impactUx":"Alto","confidence":"Media","validity":"Vigente","product":"Booking","screen":"Multipantalla","component":"Login","element":"","device":"Desktop + mobile","market":"No especificado","title":"El login dentro del booking aporta valor cuando aparece de forma contextual y activa una ventaja concreta","text":"La identificación aporta más valor cuando puede recuperarse durante el booking y explica una utilidad relevante en ese momento, como reducir cumplimentación o hacer visibles beneficios SUMA.","know":"El benchmark revisado muestra de forma recurrente que la identificación puede recuperarse una vez iniciado el booking y que el valor comunicado suele vincularse a beneficios concretos. En usuarios identificados, varias aerolíneas reutilizan además datos personales y de fidelización para reducir esfuerzo.","forEvidence":["Benchmark externo: las cinco aerolíneas analizadas permiten iniciar sesión una vez iniciado el proceso en uno o varios puntos; Disponibilidad, resumen y pasajeros son los momentos más recurrentes.","Benchmark externo: Vueling, Air France, Qatar y British Airways vinculan el acceso a beneficios concretos como compra más rápida, Millas/Avios, descuentos, extras o ahorro.","Benchmark externo: las aerolíneas revisadas recuperan datos personales y, en varios casos, el número de viajero frecuente para usuarios identificados.","Benchmark: El login puede recuperarse dentro del booking","Benchmark: El login gana valor cuando se vincula a un beneficio concreto","Benchmark: La fidelización aparece en servicios adicionales, pero no de forma homogénea"],"contrary":["El patrón no es continuo en todo el funnel: Vueling y Qatar dejan de ofrecer login visible al llegar a Extras.","La recurrencia competitiva no demuestra qué punto ni qué propuesta de valor funcionan mejor en Air Europa."],"noProof":["No demuestra impacto en conversión, tasa de login, finalización del booking o satisfacción.","No valida un punto único de login ni un mensaje concreto.","No confirma la viabilidad técnica de recuperar sesión, perfil o beneficios dentro de Amadeus."],"open":["¿En qué puntos del booking aporta realmente valor permitir login a un usuario no identificado?","¿Qué beneficio SUMA incentiva mejor la identificación: recuperar datos, acumular Millas, utilizar saldo o acceder a beneficios de nivel?","¿Qué información del perfil SUMA puede recuperarse durante el booking sin introducir inconsistencias?"],"applications":["Login contextual en Booking","Pasajeros / autocompletado","Propuesta de valor de SUMA","Persistencia de sesión","Personalización","Perfil de pasajero","Multipantalla","Login / autenticación","Acceso a login","Login contextual y recuperación de sesión","Mensaje de propuesta de valor","Login contextual y propuesta de valor","Extras","Ancillaries","Mensaje de acumulación / recompensa","Fidelización en ancillaries"],"sourceNames":["benchmark_Frequent_Flyer.xlsx","benchmark_booking_frequentflyer_sep26.pdf","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-05","classificationHistory":[{"field":"component","from":"Login / autenticación","to":"Login","at":"2026-09-21T09:48:47.467Z","origin":"Edición manual en learning"},{"field":"device","from":"No especificado","to":"Desktop + mobile","at":"2026-09-21T09:48:47.467Z","origin":"Edición manual en learning"}],"publicationHistory":[{"documentId":"IR-1789824613283","sourceName":"Benchmark","decision":"Reforzar learning existente","publishedAt":"2026-10-05T16:51:49.331Z","rowRefs":[5,6,16]}]},{"id":"L-SUMA-02","initiative":"Buscador","initiatives":["Buscador","Header","SUMA Frequent Flyer"],"area":"SUMA / Frequent Flyer","impactUx":"Alto","confidence":"Media","validity":"Vigente","product":"Booking","screen":"Disponibilidad / Fare Families","component":"Fare Families","element":"","device":"Desktop + mobile","market":"No especificado","title":"La fidelización puede aportar valor en Fare Families si distingue acumulación, tarifa y beneficios por nivel","text":"Millas, puntos de estatus y ventajas SUMA pueden participar en la comparación de tarifas, pero necesitan diferenciar claramente qué se obtiene por comprar una tarifa y qué procede del nivel del pasajero.","know":"El benchmark revisado muestra que varias aerolíneas incorporan recompensa futura o beneficios de fidelización dentro de Fare Families. La lectura UX consolidada es que estos atributos pueden enriquecer la comparación siempre que no se confundan con las inclusiones propias de la tarifa. 1 registro aporta evidencia nueva al learning existente y amplía su contexto o aplicaciones.","forEvidence":["Iberia muestra Avios y Puntos Elite por Fare Family.","Air France incorpora Millas, XP y beneficios vinculados al nivel.","Qatar muestra los Avios generados dentro del detalle de tarifa.","El benchmark también identifica casos donde la fidelización se utiliza como argumento adicional de valor durante el upsell.","Desk research: En Fare Families debería distinguirse qué incluye la tarifa, qué añade SUMA y cuál es el resultado final para el pasajero","Desk research: Mostrar Millas estimadas por tarifa puede hacer visible parte del valor futuro antes de elegir","Auditoría UX: El upsell de tarifa no incorpora el valor específico del usuario SUMA","Benchmark: La acumulación puede formar parte de la comparación de Fare Families","Benchmark: Los beneficios personalizados por nivel pueden integrarse dentro de la Fare Family"],"contrary":["La presencia de fidelización no es homogénea entre aerolíneas ni Fare Families.","Añadir más información a una comparación ya densa puede aumentar carga si no existe una jerarquía clara."],"noProof":["No demuestra que mostrar Millas o beneficios SUMA cambie la elección de Fare Family.","No demuestra impacto en conversión o revenue.","No valida una representación visual concreta ni una cantidad óptima de información."],"open":["¿Mostrar Millas o beneficios SUMA influye en la elección de Fare Family?","¿Comprenden los usuarios qué ventajas proceden de la tarifa y cuáles de su nivel SUMA?","¿Qué información aporta valor antes de seleccionar tarifa y cuál debe quedar en detalle?"],"applications":["Availability / Dispo","Fare Families","Comparación de tarifas","Acumulación de Millas","Beneficios por nivel","Upsell","Dispo","Tarifa vs SUMA","Fare Families · Proveniencia del beneficio","Millas estimadas","Fare Families · Earn estimado","Upsell Panel","Upsell de tarifa","Beneficios SUMA en mejora de tarifa","Fidelización en upsell","Availability/Dispo","Acumulación por tarifa","Fidelización en Fare Families","Beneficio asociado al nivel","Beneficios por nivel en Fare Families"],"sourceNames":["benchmark_Frequent_Flyer.xlsx","benchmark_booking_frequentflyer_sep26.pdf","Desk Research","Auditoría heurística Desktop","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-05","classificationHistory":[{"field":"device","from":"No especificado","to":"Desktop + mobile","at":"2026-09-21T09:49:05.462Z","origin":"Edición manual en learning"}],"publicationHistory":[{"documentId":"IR-1789912185048","sourceName":"Desk Research","decision":"Reforzar learning existente","publishedAt":"2026-10-05T16:17:26.412Z","rowRefs":[16,17]},{"documentId":"IR-1789897314837","sourceName":"Auditoría heurística Desktop","decision":"Ampliar learning","publishedAt":"2026-10-05T16:50:05.797Z","rowRefs":[8]},{"documentId":"IR-1789824613283","sourceName":"Benchmark","decision":"Reforzar learning existente","publishedAt":"2026-10-05T16:51:50.530Z","rowRefs":[8,9]}]},{"id":"L-SUMA-03","initiative":"Buscador","initiatives":["Buscador","Header","SUMA Frequent Flyer"],"area":"SUMA / Frequent Flyer","impactUx":"Alto","confidence":"Media","validity":"Vigente","product":"Booking","screen":"Multipantalla","component":"Beneficio de fidelización","element":"","device":"Desktop + mobile","market":"No especificado","scope":"Transversal","title":"Los beneficios SUMA deben explicarse según pasajero, condición y origen, no limitarse a mostrar el estatus","text":"Cuando una ventaja depende del nivel, del pasajero o de una condición de fidelización, la interfaz debe traducir esa relación en un beneficio comprensible y diferenciarla de lo que incluye la tarifa o el ancillary.","know":"El benchmark revisado muestra que hacer visible únicamente el estatus aporta información incompleta cuando el usuario no entiende qué ventaja activa. La necesidad se vuelve especialmente relevante en reservas multipasajero y en ancillaries como asientos o equipaje, donde la elegibilidad y el beneficio pueden variar. 3 registros aportan evidencia nueva al learning existente y amplía su contexto o aplicaciones. 1 registro aporta evidencia nueva al learning existente y amplía su contexto o aplicaciones.","forEvidence":["Air France identifica ventajas derivadas de Flying Blue y vincula determinadas ventajas al estatus.","British Airways muestra el nivel en Asientos, pero el benchmark detecta que no siempre explica qué beneficio produce.","Los registros revisados señalan que la fidelización debe asociarse al pasajero correcto cuando una reserva incluye varias personas.","En equipaje y otros ancillaries, la aplicación del beneficio depende de la asociación y del contexto; los patrones observados no son homogéneos entre productos.","Desk research: Silver, Gold y Platinum disponen de una pieza adicional de equipaje en bodega según las condiciones SUMA revisadas","Desk research: Los beneficios de asiento cambian por nivel SUMA y por momento de la reserva","Desk research: En Equipaje conviene aplicar automáticamente el derecho SUMA cuando sea posible y explicar de dónde procede","Benchmark: Los beneficios deben dejar claro de dónde proceden"],"contrary":["Los ancillaries no son productos equivalentes: asientos, equipaje y otros extras pueden requerir patrones distintos.","El benchmark ofrece referencias externas, pero no datos de comprensión o comportamiento de usuarios de Air Europa.","Auditoría UX: La interfaz no confirma con claridad que el número SUMA ya está asociado al pasajero"],"noProof":["No demuestra que todos los ancillaries deban mostrar fidelización de la misma forma.","No valida mostrar más mensajes SUMA en cada paso del booking.","No resuelve cómo deben gestionarse reservas con varios pasajeros y niveles diferentes."],"open":["¿Cómo deben comunicarse los beneficios cuando una reserva incluye varios pasajeros con situaciones SUMA diferentes?","¿Qué ancillaries se benefician realmente de incorporar información de fidelización?","¿Cómo diferenciar visualmente beneficio de tarifa, beneficio de nivel y beneficio aplicado al pasajero sin aumentar carga?"],"applications":["Pasajeros","Asientos","Equipaje","Extras / ancillaries","Multipasajero","Origen del beneficio","Mensajería de estatus","Perfil de pasajero","Beneficio SUMA","Pieza adicional","EXTRAS · Equipaje · Beneficio por nivel","Gratuidad / descuento","EXTRAS · Asientos · Beneficio por nivel","Aplicación automática y origen","EXTRAS · Equipaje · Autoaplicación","Passengers/Paxes","Pasajero frecuente","Estado de asociación SUMA","Fidelización multipasajero","Multipantalla","Beneficios de fidelización","Proveniencia y comunicación de beneficios"],"sourceNames":["benchmark_Frequent_Flyer.xlsx","benchmark_booking_frequentflyer_sep26.pdf","Desk Research","Auditoría heurística Desktop","Benchmark"],"status":"Learning consolidado","createdAt":"2026-09-19","updatedAt":"2026-10-05","classificationHistory":[{"field":"device","from":"No especificado","to":"Desktop + mobile","at":"2026-09-21T09:49:14.746Z","origin":"Edición manual en learning"}],"publicationHistory":[{"documentId":"IR-1789912185048","sourceName":"Desk Research","decision":"Ampliar learning","publishedAt":"2026-10-05T16:17:18.829Z","rowRefs":[10,11,19]},{"documentId":"IR-1789897314837","sourceName":"Auditoría heurística Desktop","decision":"Contradice learning","publishedAt":"2026-10-05T16:50:09.197Z","rowRefs":[12]},{"documentId":"IR-1789824613283","sourceName":"Benchmark","decision":"Ampliar learning","publishedAt":"2026-10-05T16:51:59.563Z","rowRefs":[18]}]},{"id":"L-ACCESO-E-01","initiative":"SUMA Frequent Flyer","initiatives":["SUMA Frequent Flyer"],"area":"Personalización; Contenido y copy","impactUx":"Alto","confidence":"Media","product":"Booking","screen":"Multipantalla","component":"Fare Families","element":"","device":"Mobile","market":"No especificado","title":"La identificación SUMA aporta valor cuando reduce esfuerzo y aprovecha información ya conocida","text":"Los registros convergen en que la identificación aporta valor cuando se utiliza primero para simplificar la tarea: recuperar información conocida, evitar repeticiones y aplicar ventajas de forma comprensible antes de añadir más comunicación comercial.","know":"Los registros convergen en que la identificación aporta valor cuando se utiliza primero para simplificar la tarea: recuperar información conocida, evitar repeticiones y aplicar ventajas de forma comprensible antes de añadir más comunicación comercial.","forEvidence":["Auditoría UX: El acceso a SUMA es visible, pero comunica sus ventajas de forma demasiado genérica","Auditoría UX: La selección de tarifa no aprovecha que el usuario está identificado para hacer visible el valor SUMA","Auditoría UX: El upsell explica el salto de tarifa, pero no incorpora el valor adicional de SUMA","Auditoría UX: Los beneficios SUMA no se anticipan antes de entrar en cada extra","Auditoría UX: Al plegar las cards se pierde contexto sobre qué beneficio SUMA se ha aplicado y a quién"],"contrary":[],"noProof":["Este learning se consolida a partir de los registros revisados de esta fuente; no demuestra por sí solo impacto causal ni permite generalizar fuera de su contexto."],"open":["¿Qué función diferencial debe tener el módulo SUMA frente al acceso \"Mi cuenta\" para evitar redundancia?","¿Amadeus permite recuperar antes de seleccionar tarifa los beneficios y Millas aplicables de forma dinámica según nivel SUMA?","¿Amadeus puede recuperar dentro del upsell beneficios por nivel y acumulación de Millas antes de confirmar el cambio?","¿Podemos recuperar los beneficios asociados al nivel antes de entrar en cada minifunnel y vincularlos al pasajero correspondiente?","¿Puede Amadeus mantener visible el origen SUMA de cada gratuidad en cards plegadas y en el resumen del viaje?"],"applications":["Home","Acceso e identificación SUMA","Personalización","Contenido y copy","Disponibilidad","Fare Families","Claridad y comprensión","Upsell Panel","Extras","Cards de extras","Encontrabilidad","Extras seleccionados","Feedback y estado"],"sourceNames":["_Frequent_Flyer_Booking_Mobile"],"status":"Learning consolidado","createdAt":"2026-10-05","updatedAt":"2026-10-05","publicationHistory":[{"documentId":"IR-1791216355875","sourceName":"_Frequent_Flyer_Booking_Mobile","decision":"Crear nuevo learning",
